name: Verify editorial catalog changes for PR 167

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - .github/workflows/reader-editorial-rebuild.yml

permissions:
  contents: read

concurrency:
  group: reader-editorial-rebuild-167
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.event.pull_request.number == 167 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/human-reader-cleanup-2026-09-15'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      EDITORIAL_BRANCH: docs/human-reader-cleanup-2026-09-15
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv sync --frozen --all-extras
      - name: Compare catalog rows with accepted main and refresh exact checksum
        run: |
          uv run python - <<'PY'
          import hashlib, json, re, sqlite3, subprocess, tempfile
          from pathlib import Path
          baseline = 'c8d628aa84140d63f6b8da8e2cba173c26c9a3b1'
          path = Path('docs/internal/institutional_catalog.sqlite3')
          previous = subprocess.check_output(['git', 'show', f'{baseline}:{path}'])
          assert hashlib.sha256(previous).hexdigest() == '27456bf47c925deddb01662a5646d51aa18cffa5ca416431a900f37dd575c227'
          edited = {'README.md', 'CONTRIBUTING.md', 'docs/wiki/Home.md', 'docs/wiki/README.md'}
          tables = ('institutional_object', 'relationship', 'institutional_search', 'reader_file',
                    'reader_publication_pair', 'reader_format_review', 'reader_search',
                    'reader_evidence_link', 'reader_evidence_package', 'reader_counterpart_audit',
                    'reader_text', 'reader_evidence_artifact')
          changed_paths = set()
          report = {}
          with tempfile.TemporaryDirectory() as directory:
              old_path = Path(directory) / 'accepted.sqlite3'
              old_path.write_bytes(previous)
              with sqlite3.connect(f'file:{old_path}?mode=ro', uri=True) as old, sqlite3.connect(f'file:{path}?mode=ro', uri=True) as new:
                  assert old.execute('PRAGMA integrity_check').fetchall() == [('ok',)]
                  assert new.execute('PRAGMA integrity_check').fetchall() == [('ok',)]
                  assert not new.execute('PRAGMA foreign_key_check').fetchall()
                  for table in tables:
                      old_cursor = old.execute(f'SELECT * FROM {table}')
                      new_cursor = new.execute(f'SELECT * FROM {table}')
                      columns = [c[0] for c in old_cursor.description]
                      assert columns == [c[0] for c in new_cursor.description]
                      old_rows, new_rows = set(old_cursor.fetchall()), set(new_cursor.fetchall())
                      delta = old_rows ^ new_rows
                      if delta:
                          assert 'path' in columns, f'Unexpected non-reader change: {table}'
                          index = columns.index('path')
                          affected = {row[index] for row in delta}
                          assert affected <= edited, (table, sorted(affected - edited))
                          changed_paths.update(affected)
                          report[table] = sorted(affected)
                      else:
                          report[table] = 'unchanged'
          assert changed_paths == edited, sorted(changed_paths)
          payload = path.read_bytes()
          new_digest = hashlib.sha256(payload).hexdigest()
          scanner = Path('scripts/check_public_safety.py')
          text = scanner.read_text()
          pattern = r'(Path\("docs/internal/institutional_catalog\.sqlite3"\): \(\n\s*)\d+(,\n\s*")[0-9a-f]{64}(",\n\s*\),)'
          match = re.search(pattern, text)
          assert match, 'Exact catalog allowance not found'
          replacement = match.group(1) + str(len(payload)) + match.group(2) + new_digest + match.group(3)
          text = text[:match.start()] + replacement + text[match.end():]
          text = text.replace('# PR145 integrated with PR164: reviewed full-publication and geography source union.',
                              '# PR167 editorial refresh: only four reader-page entries differ from PR145/164.')
          scanner.write_text(text)
          print(json.dumps({'baseline': baseline, 'tables': report, 'catalog_bytes': len(payload), 'catalog_sha256': new_digest}, indent=2))
          PY
      - name: Verify the unchanged safety and navigation rules
        run: |
          uv run python scripts/check_public_safety.py
          uv run python scripts/validate_reader_navigation.py --check-regeneration
          git diff --check
      - name: Commit only the exact catalog allowance update
        run: |
          python - <<'PY'
          import subprocess
          changed = {p for p in subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0') if p}
          # Regeneration may change SQLite storage layout, but never its logical contents.
          assert changed <= {'scripts/check_public_safety.py', 'docs/internal/institutional_catalog.sqlite3'}, changed
          PY
          uv run python scripts/check_public_safety.py
          git add -- scripts/check_public_safety.py
          if git diff --cached --quiet; then
            echo 'Exact allowance already current.'
            exit 0
          fi
          remote_head=$(git ls-remote origin "refs/heads/$EDITORIAL_BRANCH" | cut -f1)
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo 'Editorial branch moved; refusing to overwrite it.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh exact safety checksum after verifying four reader-only catalog changes'
          git push origin "HEAD:refs/heads/$EDITORIAL_BRANCH"
