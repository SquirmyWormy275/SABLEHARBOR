name: Apply and check human-facing reader cleanup

on:
  push:
    branches: [docs/human-reader-cleanup-2026-09-15]
    paths: [.github/workflows/reader-editorial-rebuild.yml]

permissions:
  contents: read

concurrency:
  group: reader-editorial-rebuild-167
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'SquirmyWormy275/SABLEHARBOR'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      EDITORIAL_BRANCH: docs/human-reader-cleanup-2026-09-15
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Install the repository's existing dependencies
        run: |
          uv sync --frozen --all-extras
          uv pip install -r tools/documents/requirements.txt -r tools/reader/requirements.txt -r tools/legal_gaps/requirements-review.txt
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Apply the reviewed prose and presentation edits
        run: |
          .venv/bin/python .github/reader_editorial_patch.py
          .venv/bin/python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              assert text.count(old) == 1, (path, old[:80])
              file.write_text(text.replace(old, new))
          replace('README.md', '## Choose what you want to do\n\n',
              '[Locations and facilities](docs/wiki/Locations.md) · [Records and decisions](docs/wiki/Records-and-Decisions.md)\n\n## Choose what you want to do\n\n')
          replace('docs/wiki/businesses/Pale-Sun-Red-Wash.md',
              'Red Wash is the Wyoming operating site, not an unknown location. The older Carbon County siting has been replaced by Sweetwater County. A separate Pale Sun office address is discussed in the [supporting location notes](../Records-and-Decisions.md#locations).\n\n', '')
          replace('docs/wiki/Locations.md',
              ' The former Carbon County siting is historical, not the current mine location.', '')
          replace('docs/wiki/Records-and-Decisions.md',
              '| Hosting and the owned data-center project |',
              '| Atlas Meridian commercial terms | [September 9 commercial decisions](../canon/DECISION_REGISTER_ADDENDUM_2026-09-09_ADVISORY_TIER1.md), including the replacements for older edition and pricing questions. |\n| Hosting and the owned data-center project |')
          PY
          .venv/bin/python - <<'PY'
          import subprocess
          from pathlib import Path
          allowed = {'README.md', 'CONTRIBUTING.md', 'docs/wiki/Home.md',
              'docs/wiki/Locations.md', 'docs/wiki/Records-and-Decisions.md',
              'docs/reader/SOURCES_AND_FORMATS.md', 'docs/organization/README.md',
              'geospatial/README.md', 'tools/wiki/export.py', 'tools/wiki/README.md',
              'tests/test_wiki_reader_layout.py'}
          paths = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')))
          paths.update(filter(None, subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']).decode().split('\0')))
          assert all(p in allowed or (Path(p).parent.as_posix() in {'docs/wiki/businesses', 'docs/wiki/departments', 'docs/wiki/subjects'} and p.endswith('.md')) for p in paths), sorted(paths)
          subprocess.run(['git', 'add', '--', *sorted(paths)], check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep decision history optional and describe the known working locations'
      - name: Check source preservation and Wiki navigation
        run: |
          .venv/bin/python -m pytest -q tests/test_wiki_reader_layout.py
          export_dir=$(mktemp -d)
          .venv/bin/python tools/wiki/export.py --revision "$(git rev-parse HEAD)" --output "$export_dir"
          .venv/bin/python -m tools.wiki.audit --export "$export_dir"
          echo "WIKI_EXPORT=$export_dir" >> "$GITHUB_ENV"
      - name: Reperform reader routes without rewriting historical QA
        run: |
          .venv/bin/python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          results = Path('docs/reader/usability/RESULTS.json')
          successor = Path('docs/legal/gap-instruments/review-support/qa/v3/NAVIGATION_SUCCESSOR_2026-09-15.json')
          receipt = successor.with_name('REVIEW.json')
          digest = lambda payload: hashlib.sha256(payload).hexdigest()
          original_receipt = receipt.read_bytes()
          prior_successor = successor.read_bytes()
          data = json.loads(prior_successor)
          record = next(r for r in data['records'] if r['path'] == str(results))
          prior_result = results.read_bytes()
          assert digest(prior_result) == record['current_sha256']
          assert digest(original_receipt) == data['historical_receipt_sha256']
          subprocess.run([sys.executable, 'tools/reader/usability.py'], check=True)
          subprocess.run([sys.executable, 'tools/reader/usability.py', '--check'], check=True)
          current_result = results.read_bytes()
          actual = json.loads(current_result)
          assert len(actual['tasks']) == 6 and all(t['result'] == 'PASS' for t in actual['tasks'])
          if current_result != prior_result:
              record['current_sha256'] = digest(current_result)
              record['scope'] = 'Reperform six reading and document-content routes after the human-facing navigation and location cleanup. Original practical-work QA remains historical.'
              record['editorial_refresh'] = {
                  'pull_request': 167,
                  'source_revision': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
                  'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                  'previous_successor_sha256': digest(prior_successor),
                  'previous_result_sha256': digest(prior_result),
                  'method': 'Run unchanged tools/reader/usability.py and its --check replay; all six declared routes and document contents passed.',
                  'limits': 'Automated route/content checks, not a new manual design approval, historical QA revision, or live Wiki publication.'
              }
              successor.write_text(json.dumps(data, indent=2) + '\n')
          assert receipt.read_bytes() == original_receipt
          PY
          .venv/bin/python tools/legal_gaps/validate_practical_work.py
      - name: Rebuild discovery records and verify the allowed logical changes
        run: |
          .venv/bin/python tools/documents/build_institutional_catalog.py
          .venv/bin/python scripts/validate_institutional_catalog.py
          .venv/bin/python scripts/validate_reader_navigation.py --check-regeneration
          .venv/bin/python - <<'PY'
          import hashlib, json, re, sqlite3, subprocess, tempfile
          from pathlib import Path
          baseline = 'c052272679fe5bd5bcc1691ea76749d5a56fd7fd'
          catalog = Path('docs/internal/institutional_catalog.sqlite3')
          prior = subprocess.check_output(['git', 'show', f'{baseline}:{catalog}'])
          assert hashlib.sha256(prior).hexdigest() == '18a68105642fa09664c980fe5b4acd048235483008be305081ffe2be8f2fc089'
          changed = set(subprocess.check_output(['git', 'diff', baseline, '--name-only']).decode().splitlines())
          # Markdown and current route QA are the only permitted reader-record changes.
          allowed = {p for p in changed if p.endswith('.md') or p in {
              'docs/reader/usability/RESULTS.json',
              'docs/legal/gap-instruments/review-support/qa/v3/NAVIGATION_SUCCESSOR_2026-09-15.json'}}
          tables = ('institutional_object', 'relationship', 'institutional_search',
              'reader_file', 'reader_publication_pair', 'reader_format_review', 'reader_search',
              'reader_evidence_link', 'reader_evidence_package', 'reader_counterpart_audit',
              'reader_text', 'reader_evidence_artifact')
          report = {}
          with tempfile.TemporaryDirectory() as directory:
              old_path = Path(directory) / 'prior.sqlite3'
              old_path.write_bytes(prior)
              with sqlite3.connect(f'file:{old_path}?mode=ro', uri=True) as old, sqlite3.connect(f'file:{catalog}?mode=ro', uri=True) as new:
                  assert old.execute('PRAGMA integrity_check').fetchall() == [('ok',)]
                  assert new.execute('PRAGMA integrity_check').fetchall() == [('ok',)]
                  assert not new.execute('PRAGMA foreign_key_check').fetchall()
                  for table in tables:
                      a = old.execute(f'SELECT * FROM {table}')
                      b = new.execute(f'SELECT * FROM {table}')
                      columns = [c[0] for c in a.description]
                      assert columns == [c[0] for c in b.description]
                      delta = set(a.fetchall()) ^ set(b.fetchall())
                      if delta:
                          assert 'path' in columns, (table, 'Non-reader table changed')
                          affected = {row[columns.index('path')] for row in delta}
                          assert affected <= allowed, (table, sorted(affected - allowed))
                          report[table] = sorted(affected)
                      else:
                          report[table] = 'unchanged'
          payload = catalog.read_bytes()
          scanner = Path('scripts/check_public_safety.py')
          text = scanner.read_text()
          pattern = r'(Path\("docs/internal/institutional_catalog\.sqlite3"\): \(\n\s*)\d+(,\n\s*")[0-9a-f]{64}(",\n\s*\),)'
          match = re.search(pattern, text)
          assert match
          text = text[:match.start()] + match.group(1) + str(len(payload)) + match.group(2) + hashlib.sha256(payload).hexdigest() + match.group(3) + text[match.end():]
          text = text.replace('# PR167 editorial refresh: only four reader-page entries differ from PR145/164.', '# PR167 reader cleanup: article/index changes checked; source and evidence tables preserved.')
          scanner.write_text(text)
          print(json.dumps(report, indent=2))
          PY
          .venv/bin/python scripts/check_public_safety.py
          .venv/bin/python scripts/validate_governance_j2.py
          .venv/bin/python scripts/validate_organization_maps.py
          .venv/bin/python scripts/validate_repository_hygiene.py
          git diff --check
      - name: Commit checked discovery updates to the same review branch
        run: |
          .venv/bin/python - <<'PY'
          import subprocess
          allowed = {
              'docs/internal/institutional_catalog.json', 'docs/internal/institutional_catalog.sqlite3',
              'docs/wiki/Library.md', 'docs/reader/usability/RESULTS.json',
              'docs/legal/gap-instruments/review-support/qa/v3/NAVIGATION_SUCCESSOR_2026-09-15.json',
              'scripts/check_public_safety.py'}
          for args in (['git', 'diff', '--name-only', '-z'], ['git', 'ls-files', '--others', '--exclude-standard', '-z']):
              paths = list(filter(None, subprocess.check_output(args).decode().split('\0')))
              assert all(p in allowed or (p.startswith('docs/wiki/library/') and p.endswith('.md')) for p in paths), paths
          PY
          git add -- docs/internal/institutional_catalog.json docs/internal/institutional_catalog.sqlite3 docs/wiki/Library.md docs/wiki/library docs/reader/usability/RESULTS.json docs/legal/gap-instruments/review-support/qa/v3/NAVIGATION_SUCCESSOR_2026-09-15.json scripts/check_public_safety.py
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh discovery and reader checks without changing historical evidence'
          fi
          remote_head=$(git ls-remote origin "refs/heads/$EDITORIAL_BRANCH" | cut -f1)
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo 'Review branch moved; refusing to overwrite it.'
            exit 1
          fi
          git push origin "HEAD:refs/heads/$EDITORIAL_BRANCH"
