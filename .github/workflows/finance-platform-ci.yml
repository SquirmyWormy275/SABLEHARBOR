name: Finance platform CI

on:
  pull_request:
  push:
    branches: [finance/enterprise-financial-platform-v0.1]

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: mkdir -p var
      - run: SHFIN_DATABASE_URL=sqlite:///var/ci-standard.db uv run alembic upgrade head
      - run: SHFIN_DATABASE_URL=sqlite:///var/ci-standard.db uv run shfin generate --profile standard --scenario base --seed 20260831
      - run: SHFIN_DATABASE_URL=sqlite:///var/ci-standard.db uv run shfin validate --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
      - run: SHFIN_DATABASE_URL=sqlite:///var/ci-standard.db uv run shfin workbooks --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
      - run: SHFIN_DATABASE_URL=sqlite:///var/ci-standard.db uv run shfin package-release --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
      - run: SHFIN_DATABASE_URL=sqlite:///var/ci-standard.db uv run shfin package-business-units --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
      - run: uv run python scripts/check_public_safety.py releases/generated/public-demo-v0.1
      - run: uv run python scripts/check_public_safety.py releases/generated/business-units
      - uses: actions/upload-artifact@v4
        with:
          name: finance-review-artifacts
          path: |
            workbooks/outputs/*.xlsx
            releases/generated/public-demo-v0.1
            releases/generated/business-units

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sable_harbor
          POSTGRES_USER: sable_harbor
          POSTGRES_PASSWORD: ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sable_harbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHFIN_DATABASE_URL: postgresql+psycopg://sable_harbor:ci_only@localhost:5432/sable_harbor
      SHFIN_POSTGRES_TEST_URL: postgresql+psycopg://sable_harbor:ci_only@localhost:5432/sable_harbor
      SHFIN_PRIVATE_BENCHMARK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: >-
          uv run pytest -s
          tests/integration/test_migrations.py
          tests/integration/test_postgres_stage1_matrix.py
          -k postgres
      - run: uv run shfin generate --profile standard --scenario base --seed 20260831
      - run: uv run shfin validate --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
