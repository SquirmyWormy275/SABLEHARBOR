name: Finance platform CI

on:
  pull_request:
  push:
    branches: [finance/enterprise-financial-platform-v0.1]

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: mkdir -p var
      - run: SHFIN_DATABASE_URL=sqlite:///var/ci-standard.db uv run alembic upgrade head
      - run: SHFIN_DATABASE_URL=sqlite:///var/ci-standard.db uv run shfin generate --profile standard --scenario base --seed 20260831
      - run: SHFIN_DATABASE_URL=sqlite:///var/ci-standard.db uv run shfin validate
      - run: SHFIN_DATABASE_URL=sqlite:///var/ci-standard.db uv run shfin workbooks
      - run: SHFIN_DATABASE_URL=sqlite:///var/ci-standard.db uv run shfin package-release
      - run: uv run python scripts/check_public_safety.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sable_harbor
          POSTGRES_USER: sable_harbor
          POSTGRES_PASSWORD: ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sable_harbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHFIN_DATABASE_URL: postgresql+psycopg://sable_harbor:ci_only@localhost:5432/sable_harbor
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run alembic upgrade head
      - run: uv run shfin generate --profile standard --scenario base --seed 20260831
      - run: uv run shfin validate
