name: Finance platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Finance tests / shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04  # ubuntu-26.04 apparmor-profiles drops extra-profiles/bwrap-userns-restrict
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHFIN_TEST_SHARDS: "8"
      SHFIN_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.12.4"
      - run: uv sync --frozen --all-extras
      - name: Build both audited native test helpers
        run: |
          uv run python tools/audit_suite/build_serialized_json.py
          uv run python tools/audit_suite/build_canonical_fragmenter.py
      - name: Prepare isolated artifact parser
        run: |
          export TMPDIR="$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          command -v bwrap
          bwrap --unshare-all --die-with-parent --new-session --clearenv \
            --ro-bind /usr /usr --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 \
            --proc /proc --dev /dev --tmpfs /tmp /usr/bin/true
          uv run python -m pytest -q tests/audit_suite/test_parser_sandbox.py::test_actual_isolated_pdf_xlsx_and_decoded_text
      - run: uv run python -m pytest -p tools.ci.shard --maxfail=1 --durations=20 --junitxml=test-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: finance-test-results-${{ matrix.shard }}
          path: test-results.xml
          if-no-files-found: error

  sqlite:
    name: Finance Platform CI / sqlite
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 lacks Playwright and bwrap AppArmor support
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.12.4"
      - run: uv sync --frozen --all-extras
      - run: mkdir -p var
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - name: CLI smoke (migrate, seed, generate, post, validate)
        run: make smoke
      - run: uv run pytest -q docs/finance/evidence/coverage/test_extracts.py
      - run: echo "SHFIN_DATABASE_URL=sqlite:///var/ci-standard.db" >> "$GITHUB_ENV"
      - run: uv run alembic upgrade head
      - run: uv run shfin generate --profile standard --scenario base --seed 20260831
      - run: uv run shfin validate --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
      - run: uv run shfin workbooks --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
      - run: uv run shfin package-release --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
      - run: uv run shfin package-business-units --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
      - run: uv run python scripts/check_public_safety.py releases/generated/public-demo-v0.1
      - run: uv run python scripts/check_public_safety.py releases/generated/business-units
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: finance-review-artifacts
          path: |
            workbooks/outputs
            releases/generated/public-demo-v0.1
            releases/generated/business-units

  postgres:
    name: Finance Platform CI / postgres
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 lacks Playwright and bwrap AppArmor support
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sable_harbor
          POSTGRES_USER: sable_harbor
          POSTGRES_PASSWORD: ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sable_harbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHFIN_DATABASE_URL: postgresql+psycopg://sable_harbor:ci_only@localhost:5432/sable_harbor
      SHFIN_POSTGRES_TEST_URL: postgresql+psycopg://sable_harbor:ci_only@localhost:5432/sable_harbor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.4"
      - run: uv sync --frozen --all-extras
      - run: >-
          uv run pytest -s
          tests/integration/test_migrations.py
          tests/integration/test_postgres_stage1_matrix.py
          -k postgres
      - run: uv run shfin generate --profile standard --scenario base --seed 20260831
      - run: uv run shfin validate --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
      - run: uv run shfin workbooks --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
      - run: uv run shfin package-release --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
      - run: uv run shfin package-business-units --generation-run-id "$(uv run shfin run-id standard --scenario base --seed 20260831)"
      - run: uv run python scripts/check_public_safety.py releases/generated/public-demo-v0.1
      - run: uv run python scripts/check_public_safety.py releases/generated/business-units
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: finance-postgres16-review-artifacts
          path: |
            workbooks/outputs
            releases/generated/public-demo-v0.1
            releases/generated/business-units
