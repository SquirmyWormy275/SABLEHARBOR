name: Materialize Sable Harbor brand system v0.2.0

on:
  push:
    branches:
      - assets/brand-integration-and-collateral-v0.2
    paths:
      - 'tools/brand/.brand-v0.2-part-*'
      - '.github/workflows/materialize-brand-v0.2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/brand-integration-and-collateral-v0.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rendering dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-inter libcairo2 libpango-1.0-0
          python -m pip install --upgrade pip
          python -m pip install cairosvg fonttools pillow python-docx python-pptx reportlab lxml

      - name: Restore reviewed deterministic generator
        run: |
          set -euo pipefail
          cat tools/brand/.brand-v0.2-part-00 \
              tools/brand/.brand-v0.2-part-01 \
              tools/brand/.brand-v0.2-part-23 \
              tools/brand/.brand-v0.2-part-45 \
            | base64 -d | gzip -dc > tools/brand/build_brand_system_v0_2.py
          chmod +x tools/brand/build_brand_system_v0_2.py
          python -m py_compile tools/brand/build_brand_system_v0_2.py

      - name: Build and validate release
        run: |
          set -euo pipefail
          python tools/brand/build_brand_system_v0_2.py --repo-root "$GITHUB_WORKSPACE"
          python scripts/validate_brand_system.py
          cd assets/brand/packages
          sha256sum -c SHA256SUMS.txt

      - name: Commit materialized production assets
        run: |
          set -euo pipefail
          rm -f tools/brand/.brand-v0.2-part-*
          rm -f .github/workflows/materialize-brand-v0.2.yml
          # Persistent workflows are added by the authenticated repository connector
          # after this materialization commit. The Actions token intentionally has
          # contents permission only and cannot itself create workflow files.
          rm -f .github/workflows/validate-brand-system.yml
          rm -f .github/workflows/publish-wiki.yml
          git config user.name "Sable Harbor Brand Bot"
          git config user.email "sable-harbor-brand-bot@users.noreply.github.com"
          git add -A
          git commit -m "Add integrated Sable Harbor brand system v0.2.0"
          git push origin HEAD:assets/brand-integration-and-collateral-v0.2
