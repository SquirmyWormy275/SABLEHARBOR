name: Legal gap instruments
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 lacks Playwright and bwrap AppArmor support
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r tools/legal_gaps/requirements-review.txt
      - run: python tools/legal_gaps/validate.py
      - run: python tools/legal_gaps/check_terms.py
      - run: python -m pytest -q tests/publications/test_legal_gap_instruments.py --confcutdir=tests/publications
      - run: python tools/legal_gaps/validate_qa.py
      - run: python tools/documents/approval_guard.py
      - run: python tools/legal_gaps/decisions.py --check
      - run: python tools/legal_gaps/accounting.py --check
      - run: python tools/legal_gaps/practice.py validate
      - run: python tools/legal_gaps/validate_review_support.py
      - run: python tools/legal_gaps/walkthroughs.py --check
      - run: python tools/legal_gaps/reconciliations.py validate
      - run: python tools/legal_gaps/reconciliations.py qa-check
      - run: python tools/legal_gaps/validate_practical_work.py
      - run: python tools/reader/usability.py --check
      - run: python -m pytest -q tests/publications/test_legal_decision_import.py tests/publications/test_legal_walkthroughs.py tests/publications/test_legal_reconciliations.py tests/publications/test_legal_package_v3.py tests/publications/test_reader_usability.py --confcutdir=tests/publications
      - run: python tools/legal_gaps/revisions.py --output "$RUNNER_TEMP/legal-revision-check" --fail-on-change
      - run: python -m pytest -q tests/publications/test_legal_decisions.py tests/publications/test_legal_accounting.py tests/publications/test_legal_practice.py tests/publications/test_legal_revisions.py tests/publications/test_legal_package.py --confcutdir=tests/publications
      - run: python tools/legal_gaps/period_close.py validate
      - run: python tools/legal_gaps/evidence_tracking.py validate
      - run: python tools/legal_gaps/case_briefs.py validate
      - run: python tools/legal_gaps/validate_close_review_v43.py
      - run: python -m pytest -q tests/publications/test_legal_period_close.py tests/publications/test_legal_evidence_tracking.py tests/publications/test_legal_source_impact.py tests/publications/test_legal_case_briefs.py tests/publications/test_legal_package_v4.py tests/publications/test_legal_dependency_successors.py --confcutdir=tests/publications
      - run: python tools/legal_gaps/package_v4.py --output "$RUNNER_TEMP/legal-review-bundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legal-review-bundle
          path: ${{ runner.temp }}/legal-review-bundle.zip
      - run: git diff --check
