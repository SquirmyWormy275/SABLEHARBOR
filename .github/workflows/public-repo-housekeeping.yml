name: Public repository housekeeping

on:
  push:
    branches:
      - canon/corporate-lore-v0.2
    paths:
      - .github/workflows/public-repo-housekeeping.yml

permissions:
  contents: write

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/corporate-lore-v0.2

      - name: Record public repository and wiki policy
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## Separation from NAILEX\n'
          section = '''## Public repository and wiki

This repository is intentionally public so Sable Harbor can support a browsable institutional archive and a public GitHub wiki. This decision supersedes the preserved architecture handover's earlier description of the canonical repository as private.

The versioned documents under `docs/canon/` remain the controlling source of truth. The wiki is a public-facing reference and navigation layer; it may summarize canon, but it does not independently create or change canon.

There will be **no standalone Easter-egg index, decoder, or exhaustive explanation page**. Easter eggs remain embedded in the history, names, artifacts, and operating lore for readers to encounter naturally.

Hidden benchmark truth, evaluation oracles, credentials, unreleased scenario answers, and other material whose value depends on nonpublic access must not be committed to this public repository or published in the wiki.

See [`docs/governance/PUBLIC_REPOSITORY_AND_WIKI_POLICY.md`](docs/governance/PUBLIC_REPOSITORY_AND_WIKI_POLICY.md).

'''
          if '## Public repository and wiki\n' not in text:
              if marker not in text:
                  raise SystemExit('README insertion marker not found')
              text = text.replace(marker, section + marker, 1)
              readme.write_text(text, encoding='utf-8')

          policy = Path('docs/governance/PUBLIC_REPOSITORY_AND_WIKI_POLICY.md')
          policy.parent.mkdir(parents=True, exist_ok=True)
          policy.write_text('''# SABLE HARBOR — PUBLIC REPOSITORY AND WIKI POLICY

**Version:** 0.1.0  
**Date:** August 31, 2026  
**Status:** LOCKED repository-governance decision

## 1. Public visibility is intentional

The Sable Harbor repository is intentionally public. Public visibility supports a browsable institutional archive, transparent project history, and a public GitHub wiki.

This decision supersedes the earlier statement in the preserved canonical architecture handover that described the repository as private. The handover remains unchanged as a historical source; this policy controls current repository visibility.

Public access is not an open-source license. Unless a specific file states otherwise, all rights are reserved and no permission is granted to copy, modify, distribute, sublicense, or commercialize the contents.

## 2. Canon remains in the repository

Versioned documents under `docs/canon/` are the controlling source of truth.

The wiki is secondary. Its purposes are to:

- provide readable institutional history;
- explain products, programs, people, facilities, and terminology;
- provide chronological and thematic navigation;
- link readers to controlling canon documents;
- distinguish LOCKED, PROVISIONAL, OPEN, and SUPERSEDED material.

A wiki page does not lock canon merely because its prose is polished. When a wiki page conflicts with a controlling canon document, the canon document controls.

Material changes to history, identity, chronology, or decision state should be made through repository review first and reflected in the wiki afterward.

## 3. No Easter-egg index

Sable Harbor will not maintain a standalone Easter-egg index, decoder, checklist, or exhaustive explanation page.

Easter eggs may remain embedded in:

- names;
- project titles;
- equipment and model identifiers;
- locations;
- quotations;
- expense-report stories;
- internal terminology;
- and corporate archaeology.

The wiki may describe an artifact naturally when it belongs in the history. It should not decode the outside reference, identify the real-world inspiration, or gather Easter eggs into a discoverable master list.

## 4. Public-content boundary

The following must not be published in the public repository or wiki:

- hidden benchmark ground truth;
- evaluation oracles and answer keys;
- credentials, tokens, keys, or private endpoints;
- unreleased scenario solutions;
- private personal information about real people;
- proprietary NAILEX implementation details that are not deliberately released;
- customer-confidential or legally restricted material;
- security-sensitive operating details whose disclosure would create avoidable risk.

When Sable Harbor requires hidden truth or spoiler-sensitive benchmark material, that material must live in a separate controlled repository, private release package, or local generation environment. Public canon may describe the existence and boundaries of such material without revealing it.

## 5. Wiki-page discipline

Substantive wiki pages should identify:

- the page's subject;
- the applicable canon state;
- the controlling repository source or sources;
- the last substantive review date;
- any unresolved or provisional details.

The wiki may use a more narrative style than the canon documents, but it must not silently collapse uncertainty, rewrite chronology, or convert authorial inspiration into in-world fact.

## 6. Initial wiki scope

The initial wiki may cover:

- Home and navigation;
- corporate history;
- Blackridge and the founding;
- the Original Eight and later people;
- Foundry and Foundry Field;
- The Crossing;
- Evalon, Emberline, and Willow;
- Atlas Meridian;
- Pale Sun and Red Wash;
- Project Cradle;
- American Resource Utility and BS&T;
- Advisory;
- locations and facilities;
- timeline;
- glossary;
- canon and continuity policy.

An Easter-egg index is expressly excluded.
''', encoding='utf-8')

          register = Path('docs/canon/DECISION_REGISTER.md')
          text = register.read_text(encoding='utf-8').rstrip() + '\n'
          if '# J. Repository visibility and wiki' not in text:
              text += '''

---

# J. Repository visibility and wiki

| ID | Decision | State | Canonical result |
|---|---|---|---|
| REP-001 | Repository visibility | LOCKED | Public visibility is intentional so Sable Harbor can support a browsable archive and public wiki |
| REP-002 | Earlier private-repository wording | SUPERSEDED | Preserved handover remains historical; current repository is intentionally public |
| REP-003 | Canon authority | LOCKED | Versioned repository canon controls; wiki is a secondary presentation and navigation layer |
| REP-004 | Wiki status discipline | LOCKED | Wiki pages must identify controlling sources and preserve LOCKED, PROVISIONAL, OPEN, and SUPERSEDED distinctions |
| REP-005 | Easter-egg index | LOCKED negative decision | No standalone index, decoder, checklist, or exhaustive explanation page |
| REP-006 | Public-content boundary | LOCKED | Hidden benchmark truth, evaluation oracles, secrets, unreleased answers, and restricted material remain outside the public repository and wiki |
| REP-007 | License posture | LOCKED | Public visibility does not grant an open-source or content license; all rights remain reserved unless stated otherwise |
| REP-008 | Wiki implementation | OPEN | Page design, initial publication sequence, and ongoing synchronization process remain to be built |
'''
              register.write_text(text, encoding='utf-8')

          changelog = Path('docs/canon/CANON_CHANGELOG_v0.2.md')
          text = changelog.read_text(encoding='utf-8').rstrip() + '\n'
          if '## CHG-017 — Public repository and wiki posture' not in text:
              text += '''

---

## CHG-017 — Public repository and wiki posture

**Prior direction:** The preserved architecture handover described the canonical Sable Harbor repository as private.

**New canon and governance decision:**

- The repository is intentionally public to support a browsable institutional archive and public GitHub wiki.
- Versioned repository documents remain controlling canon; the wiki is a secondary public-facing reference and navigation layer.
- Public visibility does not create an open-source or content license.
- Hidden benchmark truth, evaluation oracles, credentials, unreleased answers, and restricted material remain outside the public repository and wiki.
- No standalone Easter-egg index, decoder, checklist, or exhaustive explanation page will be created.

**State:** LOCKED supersession  
**Reason:** Public accessibility and a rich wiki are deliberate project features, while canon authority, intellectual-property posture, spoiler control, and embedded lore still require explicit boundaries.
'''
              changelog.write_text(text, encoding='utf-8')
          PY

      - name: Commit housekeeping
        run: |
          git config user.name 'Sable Harbor Canon Bot'
          git config user.email 'sable-harbor-canon-bot@users.noreply.github.com'
          git add README.md docs/canon/DECISION_REGISTER.md docs/canon/CANON_CHANGELOG_v0.2.md docs/governance/PUBLIC_REPOSITORY_AND_WIKI_POLICY.md
          git commit -m 'Document public repository and wiki policy'
          git push origin HEAD:canon/corporate-lore-v0.2
