name: Geospatial package
on:
  pull_request:
    paths:
      - 'geospatial/**'
      - '.github/workflows/geospatial-census.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: geospatial/requirements.txt
      - run: python -m pip install -r geospatial/requirements.txt
      - name: Validate committed geography, maps, provenance and project paths
        run: python geospatial/scripts/validate_geospatial.py
      - name: Test time uncertainty, damaged rail networks and deterministic rebuilds
        run: python -m pytest geospatial/tests -q --junitxml=geospatial/reports/TEST_RESULTS.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geospatial-package-validation
          path: geospatial/reports/
          retention-days: 30
          if-no-files-found: error
  native-qgis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native QGIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-qgis
      - name: Open original and relocated projects in QGIS
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 geospatial/scripts/validate_qgis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geospatial-native-qgis-validation
          path: geospatial/reports/QGIS_VALIDATION.json
          retention-days: 30
          if-no-files-found: error
