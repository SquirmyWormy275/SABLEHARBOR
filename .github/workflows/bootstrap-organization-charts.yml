name: Bootstrap rendered organization charts

on:
  push:
    branches:
      - docs/organization-maps-v0.1
    paths:
      - scripts/bootstrap_org_charts.b64
      - .github/workflows/bootstrap-organization-charts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out chart branch
        uses: actions/checkout@v4
        with:
          ref: docs/organization-maps-v0.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore deterministic renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          payload = "".join(Path("scripts/bootstrap_org_charts.b64").read_text().split())
          renderer = gzip.decompress(base64.b64decode(payload))
          target = Path("scripts/build_organization_charts.py")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(renderer)
          target.chmod(0o755)
          PY

      - name: Render and validate organization charts
        run: python scripts/build_organization_charts.py

      - name: Commit rendered chart package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/organization scripts/build_organization_charts.py
          if git diff --cached --quiet; then
            echo "No rendered changes."
            exit 0
          fi
          git commit -m "Render canon-derived Sable Harbor organization charts"
          git push origin HEAD:docs/organization-maps-v0.1
