name: Validate rendered organization charts

on:
  pull_request:
    paths:
      - README.md
      - docs/canon/**
      - docs/organization/**
      - scripts/build_organization_charts.py
      - scripts/regenerate_organization_package.py
      - scripts/validate_organization_maps.py
      - .github/workflows/validate-organization-charts.yml
  push:
    branches:
      - main
      - docs/enterprise-portal-and-repo-hygiene-v0.1
    paths:
      - README.md
      - docs/canon/**
      - docs/organization/**
      - scripts/build_organization_charts.py
      - scripts/regenerate_organization_package.py
      - scripts/validate_organization_maps.py
      - .github/workflows/validate-organization-charts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate and XML-validate chart package
        run: python scripts/regenerate_organization_package.py

      - name: Validate chart register, pages, and assets
        run: python scripts/validate_organization_maps.py

      - name: Verify generated chart artifacts are current
        run: git diff --exit-code -- docs/organization
