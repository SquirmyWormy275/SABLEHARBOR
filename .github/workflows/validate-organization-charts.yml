name: Validate rendered organization charts

on:
  pull_request:
    paths:
      - README.md
      - docs/canon/**
      - docs/organization/**
      - docs/structured/j2_leadership_2026-09-10.json
      - scripts/*organization*.py
      - tools/organization/**
      - tests/unit/test_organization_generator.py
      - tests/unit/test_j2_leadership.py
      - tests/unit/test_j2_archive_boundary.py
      - industrial/source/**
      - assets/brand/logos/**
      - docs/business-lines/**
      - docs/governance/**
      - docs/j2/**
      - .github/workflows/validate-organization-charts.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/canon/**
      - docs/organization/**
      - docs/structured/j2_leadership_2026-09-10.json
      - scripts/*organization*.py
      - tools/organization/**
      - tests/unit/test_organization_generator.py
      - tests/unit/test_j2_leadership.py
      - tests/unit/test_j2_archive_boundary.py
      - industrial/source/**
      - assets/brand/logos/**
      - docs/business-lines/**
      - docs/governance/**
      - docs/j2/**
      - .github/workflows/validate-organization-charts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install chart dependencies
        run: python -m pip install -e ".[dev]" -r tools/organization/requirements.txt

      - name: Regenerate charts
        run: python scripts/build_organization_charts.py

      - name: Validate complete chart coverage
        run: python scripts/validate_organization_maps.py

      - name: Verify chart behavior
        run: python -m pytest tests/unit/test_organization_generator.py tests/unit/test_j2_leadership.py tests/unit/test_j2_archive_boundary.py

      - name: Verify rendered files are current
        run: |
          git diff --exit-code -- README.md docs/organization
          test -z "$(git ls-files --others --exclude-standard docs/organization)"
