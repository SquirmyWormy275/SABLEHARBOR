name: Build approved J2 leadership successor
on:
  push:
    branches: ['canon/j2-leadership-2026-09-10']
    paths: ['.github/workflows/j2-leadership-build.yml']
permissions:
  contents: write
concurrency:
  group: j2-leadership-publication-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'SquirmyWormy275/SABLEHARBOR' && github.ref == 'refs/heads/canon/j2-leadership-2026-09-10'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: canon/j2-leadership-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing publication and test toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer ghostscript qpdf poppler-utils texlive-latex-base texlive-latex-extra texlive-fonts-recommended
          python -m pip install -e '.[dev]' -r tools/documents/requirements.txt -r tools/organization/requirements.txt
      - name: Author the bounded approved successor and regenerate representations
        run: |
          python tools/organization/adopt_j2_leadership_20260910.py --apply
          python scripts/build_organization_charts.py
          python tools/documents/build_controlled_publications.py --normalizer pypdf
          python tools/documents/build_institutional_catalog.py
          git diff --check
      - name: Validate names, prior artwork, catalog, authority and repository boundaries
        run: |
          set -o pipefail
          python scripts/validate_governance_j2.py
          python scripts/validate_institutional_catalog.py
          python scripts/validate_organization_maps.py
          python scripts/validate_repository_hygiene.py
          python scripts/validate_business_records.py
          python -m pytest tests/unit/test_j2_leadership.py tests/unit/test_organization_generator.py -q | tee "$RUNNER_TEMP/j2-targeted-tests.txt"
          python -m pytest -q | tee "$RUNNER_TEMP/j2-full-tests.txt"
          git diff --check
      - name: Record verification and preserve the independent work boundaries
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()))
          untracked = set(filter(None, subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard']).decode().splitlines()))
          allowed = ('docs/organization/', 'docs/structured/j2_leadership_', 'docs/j2/publications/SH-J2-PPL-', 'docs/internal/validation/J2_LEADERSHIP_', 'tools/organization/', 'tools/documents/', 'tests/unit/')
          exact = {'README.md', 'docs/CONTROLLED_DOCUMENT_INDEX.md', 'docs/canon/J2_LEADERSHIP_APPOINTMENTS_2026-09-10.md', 'docs/j2/README.md', 'docs/internal/OPEN_CANON_AND_HYGIENE_ISSUE_INDEX.md', 'docs/internal/institutional_catalog.json', 'docs/internal/institutional_catalog.sqlite3', 'docs/governance/publication_manifest.json', '.github/workflows/validate-organization-charts.yml'}
          unexpected = sorted(p for p in changed | untracked if p not in exact and not p.startswith(allowed))
          if unexpected:
              raise SystemExit('Out-of-scope changes: ' + repr(unexpected))
          source = json.loads((root / 'docs/organization/source/chartbook.json').read_text())
          targeted = pathlib.Path(os.environ['RUNNER_TEMP'], 'j2-targeted-tests.txt').read_text()
          full = pathlib.Path(os.environ['RUNNER_TEMP'], 'j2-full-tests.txt').read_text()
          report = root / 'docs/internal/validation/J2_LEADERSHIP_2026-09-10.md'
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text('# J2 leadership integration validation\n\n'
              '**Decision:** `SH-J2-PPL-20260910`  \n'
              '**Implementation PR:** #118  \n'
              '**Source input commit:** `' + os.environ['GITHUB_SHA'] + '`  \n'
              '**Baseline main:** `57cfa1b1c483ccf1f8b15d82c4cbdadbeef8063e`  \n\n'
              'Six approved people occupy existing roles; no appointment dates, biographies, incremental billets, payroll or new authority are inferred. The Chief of Staff and other unnamed deputies remain open.\n\n'
              'The prior 56-page master and 202-record display source are byte-preserved in `docs/organization/history/v1.0.0/`. The successor has 40 chart families, 57 pages, 208 display records and 51 unique current named people. All prior content is raster-compared outside the authorized enterprise card and publication footers.\n\n'
              'Master SHA-256: `' + source['visual_master_sha256'] + '`.\n\n'
              'Automated checks passed: governance/J2, institutional catalog, organization maps, repository hygiene, business records, exact roster and corrections, residual roles, original artwork preservation, publication footers, migration/export idempotence and whitespace.\n\n'
              '## Targeted test result\n\n```text\n' + targeted.strip() + '\n```\n\n'
              '## Full repository pytest result\n\n```text\n' + full.strip() + '\n```\n\n'
              'Generated chart and controlled-publication review artifacts are attached to the build run. Human visual review and final main acceptance are recorded in PR #118; this automated record does not claim either occurred.\n')
          PY
      - name: Commit generated representations to the isolated leadership branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs tools tests .github/workflows/validate-organization-charts.yml
          git diff --cached --check
          git commit -m 'Integrate six approved J2 leaders and validated publication successor'
          git push origin HEAD:refs/heads/canon/j2-leadership-2026-09-10
      - name: Package the exact generated review output
        run: |
          python - <<'PY'
          import pathlib, shutil, subprocess, json
          root = pathlib.Path.cwd(); out = root / '_j2_completed_review'; out.mkdir()
          names = subprocess.check_output(['git', 'diff', '--name-only', '57cfa1b1c483ccf1f8b15d82c4cbdadbeef8063e', 'HEAD']).decode().splitlines()
          for name in names:
              p = root / name
              if p.is_file():
                  dest = out / name; dest.parent.mkdir(parents=True, exist_ok=True); shutil.copyfile(p, dest)
          (out / 'accepted_branch_head.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode())
          (out / 'changed_paths.json').write_text(json.dumps(names, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: j2-leadership-completed-review
          path: _j2_completed_review/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
