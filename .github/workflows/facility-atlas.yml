name: Facility program and atlas
on:
  pull_request:
    paths: ['geospatial/**', 'industrial/source/**', 'docs/organization/source/**', 'enterprise/services/source/**', 'enterprise/runtime/**', 'docs/facilities/references/**', '.github/workflows/facility-atlas.yml']
  push:
    branches: [main]
    paths: ['geospatial/**', 'industrial/source/**', 'docs/organization/source/**', 'enterprise/services/source/**', 'enterprise/runtime/**', 'docs/facilities/references/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF Pillow pytest shapely==2.1.2 pyproj==3.7.2 cairosvg
      - name: Coverage, population, geometry, capacity and publication links
        run: python geospatial/facilities/validate.py --check --require-atlas
      - name: Validate the isolated visitor-map draft
        run: python geospatial/facilities/visitor/validate.py
      - name: Acceptance regression mutations
        run: python -m pytest -q geospatial/facilities/test_facilities.py geospatial/facilities/coverage/test_coverage.py geospatial/facilities/population/test_population.py
      - name: Planning workbench freshness and regression tests
        run: |
          python geospatial/facilities/workbench/build.py build --check
          python -m pytest -q geospatial/facilities/workbench
          node geospatial/facilities/workbench/test_app.cjs
      - name: Spatial model, artifact freshness and coordination regression tests
        run: |
          python geospatial/facilities/spatial/build.py --check
          python -m pytest -q geospatial/facilities/spatial
          node geospatial/facilities/spatial/test_viewer.cjs
      - name: Diagnose context drift without rewriting generated outputs
        if: failure()
        run: |
          python - <<'PYTHON'
          import importlib.util, json
          from pathlib import Path
          path = Path("geospatial/facilities/spatial/context.py")
          spec = importlib.util.spec_from_file_location("diagnostic_context", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          before = json.loads(Path("geospatial/facilities/spatial/CONTEXT.json").read_text())
          after = json.loads(json.dumps(module.build_context(Path.cwd())))
          differences = []
          def compare(a, b, path=""):
              if len(differences) >= 20 or a == b:
                  return
              if isinstance(a, dict) and isinstance(b, dict):
                  for key in sorted(set(a) | set(b)):
                      compare(a.get(key), b.get(key), path + "/" + key)
              elif isinstance(a, list) and isinstance(b, list) and len(a) == len(b):
                  for index, (x, y) in enumerate(zip(a, b)):
                      compare(x, y, path + "/" + str(index))
              else:
                  differences.append({"path": path, "committed": a, "rebuilt": b})
          compare(before, after)
          print(json.dumps(differences, indent=2))
          import pyproj, shapely
          print("PROJ", pyproj.proj_version_str, "GEOS", shapely.geos_version_string)
          PYTHON
      - name: Generated checks leave committed source and manifests unchanged
        run: git diff --exit-code -- geospatial/facilities geospatial/maps/facilities
