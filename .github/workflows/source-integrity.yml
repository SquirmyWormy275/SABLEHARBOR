name: Required source integrity
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    name: Source integrity / required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-09-15
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1, existing repository pin
        with:
          version: '0.12.4'
      - run: uv sync --frozen --all-extras
      - run: uv run python scripts/validate_repository_hygiene.py
      - run: uv run python tools/documents/approval_guard.py
      - run: uv run python scripts/check_public_safety.py
      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || 'HEAD' }}" HEAD
