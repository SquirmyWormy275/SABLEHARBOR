name: Publish reviewed wiki source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm publication from main
        run: |
          test "${GITHUB_REF_NAME}" = "main" || { echo "Publish only from main"; exit 1; }
      - name: Confirm the GitHub Wiki is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(request) as response:
              metadata = json.load(response)
          if not metadata.get("has_wiki"):
              raise SystemExit("GitHub Wiki is disabled. Enable it in repository settings before publishing.")
          PY
      - name: Publish docs/wiki to the wiki repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-out
          find wiki-out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp docs/wiki/*.md wiki-out/
          cd wiki-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki already current"
          else
            git commit -m "Publish wiki from ${GITHUB_SHA}"
            git push
          fi
