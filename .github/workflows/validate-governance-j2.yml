name: Validate governance, J2, and Alexandria

on:
  pull_request:
    paths:
      - README.md
      - docs/wiki/**
      - docs/reader/**
      - docs/finance/READER_EXERCISES.md
      - docs/handoffs/FINANCE_HUMAN_EVIDENCE_COMPLETION.md
      - scripts/validate_reader_navigation.py
      - scripts/validate_reader_workqueue.py
      - docs/canon/**
      - docs/governance/**
      - docs/j2/**
      - docs/organization/**
      - assets/brand/**
      - scripts/validate_governance_j2.py
      - scripts/validate_organization_maps.py
      - scripts/organization_history.py
      - tools/organization/**
      - tools/documents/**
      - tests/publications/**
      - tests/unit/test_controlled_publication_catalog.py
      - docs/internal/**
      - docs/finance/evidence/**
      - docs/legal/evidence/**
      - docs/legal/full-text/**
      - scripts/validate_finance_evidence_acceptance.py
      - docs/structured/**
      - docs/business-lines/**
      - scripts/validate_business_records.py
      - .github/workflows/validate-governance-j2.yml
  push:
    branches: [architecture/common-controls-framework-v0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check PDF compatibility backend
        run: |
          python -m pip install -r tools/documents/requirements.txt -r tools/organization/requirements.txt
          python -m unittest discover -s tests/publications
      - run: python scripts/validate_reader_workqueue.py
      - run: python scripts/validate_governance_j2.py
      - run: python scripts/validate_institutional_catalog.py
      - run: python scripts/validate_finance_evidence_acceptance.py
      - name: Validate accounting and legal source packages
        run: |
          python - <<'PY'
          import json, pathlib, re, subprocess
          inputs = [('docs/reader/reconciliation/records.json', 'base_revision'),
                    ('docs/legal/full-text/SOURCE_MANIFEST.json', 'source_revision')]
          for path, key in inputs:
              if not pathlib.Path(path).is_file():
                  continue
              revision = json.load(open(path))[key]
              assert re.fullmatch(r'[0-9a-f]{40}', revision)
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', revision], check=True)
          PY
          python docs/finance/evidence/coverage/validate.py
          python docs/reader/transactions/validate.py
          python docs/reader/reconciliation/build.py --check
      - name: Validate complete legal source editions when present
        run: |
          if [ -f docs/legal/full-text/render-manifest.json ]; then
            python -m pip install -r docs/legal/full-text/requirements.txt
            python docs/legal/full-text/validate.py
            python -m pytest -q docs/legal/full-text/test_full_text.py
            python docs/legal/full-text/validate_qa.py
          fi
      - name: Reconcile reader library
        run: |
          python scripts/validate_reader_navigation.py --check-regeneration
          git diff --exit-code -- docs/internal/institutional_catalog.json docs/wiki/Library.md docs/wiki/library
      - run: python scripts/validate_organization_maps.py
      - run: python scripts/validate_repository_hygiene.py
      - run: python scripts/validate_business_records.py
