name: Business finance successor acceptance

on:
  pull_request:
    paths:
      - enterprise/**
      - industrial/**
      - red_wash/**
      - src/**
      - config/**
      - docs/canon/**
      - docs/advisory/**
      - docs/business-lines/**
      - uv.lock
      - .github/workflows/business-finance-ci.yml
  push:
    branches: [main]
    paths:
      - enterprise/**
      - industrial/planning/enterprise.py
      - .github/workflows/business-finance-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run python -m pytest enterprise/business/tests industrial/planning/tests
      - name: Build and reconcile the complete business successor
        run: uv run python -m enterprise.business.build
      - name: Reproduce complete package bytes from identical source
        run: |
          cp enterprise/dist/v1.0.0/SHA256SUMS.txt /tmp/business-first-sha256.txt
          uv run python -m enterprise.business.build
          cmp /tmp/business-first-sha256.txt enterprise/dist/v1.0.0/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: business-finance-v1-review
          path: enterprise/dist/v1.0.0/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: reconcile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Retrieve the exact verified artifact from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name business-finance-v1-review --dir /tmp/business-release
      - name: Verify source identity and publish an immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/business-release
          sha256sum --check SHA256SUMS.txt
          python - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile('sable-harbor-business-finance-v1.0.0.zip') as archive:
              identity=json.loads(archive.read('identity.json'))
              assert identity['source_revision']==os.environ['GITHUB_SHA']
              assert identity['dirty_development_build'] is False
              assert json.loads(archive.read('validation.json'))['status']=='PASS'
          PY
          if gh release view business-finance-v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Version already published. Preserve its bytes; increment the successor version for a new release.'
            exit 0
          fi
          gh release create business-finance-v1.0.0 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Business-driven enterprise finance v1.0.0' \
            --notes-file "$GITHUB_WORKSPACE/docs/releases/BUSINESS_FINANCE_RELEASES.md" \
            sable-harbor-business-finance-v1.0.0.zip SHA256SUMS.txt
