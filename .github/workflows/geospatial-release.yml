name: Publish controlled Geo release
on:
  push:
    branches: [main]
    paths: ['geospatial/releases/version.json']
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Geospatial Release / release
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 lacks Playwright and bwrap AppArmor support
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Package exact accepted repository bytes twice
        run: |
          python geospatial/scripts/package_release.py
          cp geospatial/dist/SHA256SUMS.txt /tmp/geo-first-sums.txt
          python geospatial/scripts/package_release.py
          cmp /tmp/geo-first-sums.txt geospatial/dist/SHA256SUMS.txt
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GEO_TAG=$(python -c "import json; print(json.load(open('geospatial/releases/version.json'))['tag'])")
          GEO_VERSION=$(python -c "import json; print(json.load(open('geospatial/releases/version.json'))['version'])")
          GEO_ZIP="geospatial/dist/sable-harbor-geospatial-v${GEO_VERSION}.zip"
          GEO_NOTES="geospatial/releases/RELEASE_NOTES_${GEO_VERSION#*-}.md"
          test -f "$GEO_ZIP" || { echo "::error::missing release archive $GEO_ZIP"; exit 1; }
          test -f "$GEO_NOTES" || { echo "::error::missing release notes $GEO_NOTES"; exit 1; }
          gh release create "$GEO_TAG" --target "$GITHUB_SHA" --prerelease --title "Sable Harbor geospatial v${GEO_VERSION}" --notes-file "$GEO_NOTES" "$GEO_ZIP" geospatial/dist/MANIFEST.json geospatial/dist/SHA256SUMS.txt
