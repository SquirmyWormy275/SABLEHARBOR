# Temporary review helper; removed from the candidate and final main tree.
name: Reader sweep workbench
on:
  push:
    branches: [docs/reader-sweep-2026-10-09]
    paths: [.github/workflows/reader-sweep-workbench.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.4'
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Check preimages and apply final reader corrections
        run: |
          mkdir -p "$RUNNER_TEMP/reader-review"
          python - <<'PY'
          import json, os, runpy, sqlite3, subprocess
          from pathlib import Path
          baseline = '99596085ac4e672062d1fd95483a5fef16c953fc'
          helpers = {'.github/workflows/reader-sweep-workbench.yml', 'tools/reader_sweep_followup.py'}
          drift = set(subprocess.check_output(['git', 'diff', '--name-only', baseline, 'HEAD']).decode().splitlines())
          assert drift <= helpers, drift - helpers
          out = Path(os.environ['RUNNER_TEMP']) / 'reader-review'
          db = sqlite3.connect('docs/internal/institutional_catalog.sqlite3')
          stable = ['institutional_object', 'relationship', 'reader_publication_pair', 'reader_evidence_link', 'reader_evidence_package', 'reader_counterpart_audit', 'reader_evidence_artifact']
          saved = {t: sorted(db.execute('SELECT * FROM ' + t).fetchall()) for t in stable}
          (out / 'stable-tables-before.json').write_text(json.dumps(saved))
          db.close()
          result = runpy.run_path('tools/reader_sweep_followup.py')
          assert len(result['changed']) == 7
          for name in ['docs/advisory/README.md', 'docs/governance/board-records/README.md']:
              path = Path(name)
              path.write_text(path.read_text().replace('  \n', '\n\n'))
          (out / 'edited-pages.json').write_text(json.dumps(sorted(result['changed']), indent=2))
          PY
          git rm -f .github/workflows/reader-sweep-workbench.yml tools/reader_sweep_followup.py
          git add -u
      - name: Regenerate the catalog and preserve all company records
        run: |
          uv run python tools/documents/build_institutional_catalog.py
          python - <<'PY'
          import hashlib, json, os, re, sqlite3
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'reader-review'
          saved = json.loads((out / 'stable-tables-before.json').read_text())
          db = sqlite3.connect('docs/internal/institutional_catalog.sqlite3')
          for name, rows in saved.items():
              actual = sorted(db.execute('SELECT * FROM ' + name).fetchall())
              assert json.loads(json.dumps(actual)) == rows, f'Protected catalog table changed: {name}'
          db.close()
          data = Path('docs/internal/institutional_catalog.sqlite3').read_bytes()
          guard = Path('scripts/check_public_safety.py')
          pattern = r'(Path\("docs/internal/institutional_catalog\.sqlite3"\): \(\s*)\d+(,\s*)"[0-9a-f]{64}"'
          text, count = re.subn(pattern, lambda m: m[1] + str(len(data)) + m[2] + '"' + hashlib.sha256(data).hexdigest() + '"', guard.read_text())
          assert count == 1
          guard.write_text(text)
          print('Institutional objects, relationships, publications and evidence tables are unchanged.')
          PY
          git add -u
      - name: Validate source integrity and reader navigation
        run: |
          set -euo pipefail
          {
            uv run python scripts/validate_governance_j2.py
            uv run python scripts/validate_institutional_catalog.py
            uv run python scripts/validate_organization_maps.py
            uv run python scripts/validate_repository_hygiene.py
            uv run python scripts/validate_reader_navigation.py --check-regeneration
            uv run python scripts/check_public_safety.py
            git diff --check HEAD
          } 2>&1 | tee "$RUNNER_TEMP/reader-review/source-checks.log"
      - name: Validate the complete Wiki
        run: |
          set -euo pipefail
          {
            uv run python -m unittest discover -s tests/wiki
            uv run python tools/wiki/export.py --revision "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/reader-review/wiki-export"
            uv run python -m tools.wiki.audit --export "$RUNNER_TEMP/reader-review/wiki-export"
          } 2>&1 | tee "$RUNNER_TEMP/reader-review/wiki-checks.log"
      - name: Check availability of the existing Wiki publication credential
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -n "$WIKI_TOKEN" ]; then
            echo 'Existing Wiki publication credential is configured.' | tee "$RUNNER_TEMP/reader-review/publication-credential-status.txt"
          else
            echo 'Existing Wiki publication credential is not configured.' | tee "$RUNNER_TEMP/reader-review/publication-credential-status.txt"
          fi
      - name: Create isolated review commit without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, shutil, subprocess, urllib.request
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'reader-review'
          edited = set(json.loads((out / 'edited-pages.json').read_text()))
          helpers = {'.github/workflows/reader-sweep-workbench.yml', 'tools/reader_sweep_followup.py'}
          generated = {'docs/internal/institutional_catalog.json', 'docs/internal/institutional_catalog.sqlite3', 'docs/wiki/Library.md', 'scripts/check_public_safety.py'}
          subprocess.run(['git', 'add', '-u'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines()
          for path in changed:
              assert path in edited | helpers | generated or path.startswith('docs/wiki/library/'), path
          assert all(not Path(p).exists() for p in helpers)
          (out / 'candidate.diff').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--', '.', ':!docs/internal/institutional_catalog.sqlite3']))
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip()
          def api(endpoint, data):
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + endpoint, data=json.dumps(data).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response)
          entries = []
          for name in changed:
              path = Path(name)
              sha = None
              if path.exists():
                  sha = api('/git/blobs', {'content': base64.b64encode(path.read_bytes()).decode(), 'encoding': 'base64'})['sha']
                  target = out / 'changed-files' / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, target)
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': entries})['sha']
          commit = api('/git/commits', {'message': 'Complete the reader sweep and show the resolved J2 leadership', 'tree': tree, 'parents': [parent]})
          result = {'candidate_sha': commit['sha'], 'parent_sha': parent, 'tree_sha': tree, 'changed_files': changed, 'url': commit['html_url']}
          (out / 'candidate-commit.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reader-final-candidate
          path: ${{ runner.temp }}/reader-review
          retention-days: 3
          if-no-files-found: error
