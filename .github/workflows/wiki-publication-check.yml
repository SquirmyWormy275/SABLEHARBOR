# One-off publication job; this helper is not proposed for main.
name: Publish merged reader sweep
on:
  push:
    branches: [ops/wiki-publication-2026-10-09]
    paths: [.github/workflows/wiki-publication-check.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the merged source revision
        run: |
          test "$(git rev-parse HEAD)" = '9b1b5dceca26524f4d357363f132c6c13dea9da7'
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/wiki-publication-check.yml
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.4'
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Publish accepted main and verify the remote copy
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          uv run python -m tools.wiki.publish 2>&1 | tee "$RUNNER_TEMP/wiki-publication.log"
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('var/wiki-publication.json').read_text())
          assert result['source_revision'] == '9b1b5dceca26524f4d357363f132c6c13dea9da7'
          assert result['verified_pages'] == 641
          print('Verified all published pages against the merged source revision.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: merged-reader-wiki-publication
          path: |
            var/wiki-publication.json
            ${{ runner.temp }}/wiki-publication.log
          if-no-files-found: warn
          retention-days: 7
