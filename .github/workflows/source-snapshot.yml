name: Export source snapshot

on:
  push:
    branches:
      - tooling/source-snapshot-20260901

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          tar --exclude=.git --exclude=.venv --exclude='**/__pycache__' -czf /tmp/SABLEHARBOR-finance-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: SABLEHARBOR-finance-source
          path: /tmp/SABLEHARBOR-finance-source.tar.gz
          if-no-files-found: error
          retention-days: 1
