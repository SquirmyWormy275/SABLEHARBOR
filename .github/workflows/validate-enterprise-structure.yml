name: Validate enterprise structure

on:
  pull_request:
  push:
    branches:
      - main
      - finance/enterprise-financial-platform-v0.1
      - integration/enterprise-audit-and-dossiers-v0.1

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_enterprise_structure.py
      - run: python scripts/validate_organization_maps.py
      - run: python scripts/validate_brand_system.py
