name: Industrial case acceptance

on:
  pull_request:
    paths:
      - industrial/**
      - red_wash/**
      - docs/canon/**
      - docs/structured/**
      - docs/organization/**
      - assets/brand/**
      - .github/workflows/industrial-case-ci.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Industrial Case CI / reconcile
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 lacks Playwright and bwrap AppArmor support
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python industrial/tools/validate_industrial_case.py --generate
      - run: python -m unittest discover -s industrial/tests -v
      - run: python -m unittest discover -s red_wash/tests -v
      - name: Build clean source-bound participant release
        run: python industrial/tools/build_package.py
      - name: Independently rebuild all inputs and compare archive bytes
        run: |
          cp industrial/dist/SHA256SUMS.txt /tmp/industrial-first-sha256.txt
          python industrial/tools/build_package.py
          cmp /tmp/industrial-first-sha256.txt industrial/dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: industrial-participant-review
          path: industrial/dist/
          if-no-files-found: error
