name: One-time PR 116 reviewed workbook transport

on:
  pull_request:
    paths:
      - .github/workflows/operations-review-preparation.yml

permissions:
  contents: read

jobs:
  store-reviewed-blob:
    if: github.event.pull_request.number == 116 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5e6d8e18df980c2bf0916f627f02d62b1cb7d0f8
          persist-credentials: false
      - name: Store exact independently reviewed workbook bytes without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, urllib.request, zipfile, zlib
          api = 'https://api.github.com/repos/SquirmyWormy275/SABLEHARBOR/git/blobs'
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          old = pathlib.Path('enterprise/operations/publications/operating-review-v1.0.0.xlsx').read_bytes()
          assert hashlib.sha256(old).hexdigest() == 'cef0ae274439cb19dd11a3587b1f56828d79dc49b18f72ea0015689406acc629'
          request = urllib.request.Request(api+'/c604526966f7cf6b1a76546d0adda15b17ece127', headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              transport = json.load(response)
          encoded = base64.b64decode(transport['content'])
          assert hashlib.sha256(encoded).hexdigest() == '1dfdcfe2e631d5cd096f5658ad2e3fbdc858c75fe1adac00de80d115bb5f1f1b'
          # Lossless transport of Artifact Tool-authored XML; no model or formula generation.
          entries = json.loads(zlib.decompress(base64.b64decode(encoded)))
          source = zipfile.ZipFile(io.BytesIO(old))
          assert [n for n, _ in entries] == source.namelist()
          target = io.BytesIO()
          with zipfile.ZipFile(target, 'w') as out:
              for name, commands in entries:
                  prior = source.read(name).decode('utf-8')
                  text = prior if commands is None else ''.join(prior[c[0]:c[0]+c[1]] if isinstance(c,list) else c for c in commands)
                  info = zipfile.ZipInfo(name, (2026,9,9,0,0,0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  out.writestr(info, text.encode('utf-8'), compresslevel=9)
          content = target.getvalue()
          assert hashlib.sha256(content).hexdigest() == '6a5942cd6ac363fe496476e6923c6f805069bf60f063fec47044d1f62c24a905'
          expected = '9a9df3bb2585c2d368b417c3b97ef7b81be97dbb'
          assert hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest() == expected
          request = urllib.request.Request(api, data=json.dumps({'encoding':'base64','content':base64.b64encode(content).decode()}).encode(), headers=headers, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['sha'] == expected
          print(json.dumps({'workbook_blob_sha':result['sha'],'sha256':hashlib.sha256(content).hexdigest(),'bytes':len(content),'ref_changed':False},indent=2))
          PY
