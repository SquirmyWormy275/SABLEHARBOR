name: Build Sable Harbor logo system

on:
  push:
    branches:
      - brand/logo-system-v0.1
    paths:
      - .github/workflows/build-sable-harbor-brand-assets.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/logo-system-v0.1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cairosvg fonttools pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig fonts-inter || sudo apt-get install -y -qq fontconfig fonts-dejavu-core

      - name: Reconstruct the deterministic generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/brand
          cat .brand-materialization/source-*.part > tools/brand/generate_sable_harbor_brand_assets.py
          python -m py_compile tools/brand/generate_sable_harbor_brand_assets.py

      - name: Generate individual SVG and PNG logo assets
        shell: bash
        run: |
          set -euo pipefail
          medium="$(fc-match -f '%{file}\n' 'Inter Display:style=Medium' | head -n1)"
          semibold="$(fc-match -f '%{file}\n' 'Inter Display:style=SemiBold' | head -n1)"
          bold="$(fc-match -f '%{file}\n' 'Inter Display:style=Bold' | head -n1)"
          if [[ ! -f "$medium" ]]; then medium="$(fc-match -f '%{file}\n' 'DejaVu Sans:style=Book' | head -n1)"; fi
          if [[ ! -f "$semibold" ]]; then semibold="$(fc-match -f '%{file}\n' 'DejaVu Sans:style=Bold' | head -n1)"; fi
          if [[ ! -f "$bold" ]]; then bold="$semibold"; fi

          build="$GITHUB_WORKSPACE/.brand-build/sable-harbor-brand-assets-v0.1.0"
          export SABLE_HARBOR_ASSET_OUT="$build"
          export SABLE_HARBOR_FONT_MEDIUM="$medium"
          export SABLE_HARBOR_FONT_SEMIBOLD="$semibold"
          export SABLE_HARBOR_FONT_BOLD="$bold"
          python tools/brand/generate_sable_harbor_brand_assets.py | tee brand-build-result.json

          rm -rf assets/brand/logos assets/brand/packages
          mkdir -p assets/brand/logos assets/brand/packages docs/brand
          cp -a "$build"/assets/brand/logos/. assets/brand/logos/
          cp -a "$build"/packages/. assets/brand/packages/
          cp "$build"/manifest.json assets/brand/manifest.json
          cp "$build"/README.md docs/brand/LOGO_SYSTEM.md
          cp "$build"/VALIDATION.md docs/brand/LOGO_VALIDATION.md

      - name: Build the repository and wiki logo index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          manifest = json.loads((root / 'assets/brand/manifest.json').read_text())
          brand_meta = {}
          for asset in manifest['assets']:
              brand_meta.setdefault(asset['brand_slug'], {
                  'name': asset['brand'],
                  'classification': asset['classification'],
                  'status': asset['canonical_status'],
              })

          core = [
              'sable-harbor',
              'foundry-field',
              'willow',
              'atlas-meridian',
              'pale-sun',
              'project-cradle',
              'american-resource-utility',
              'advisory',
          ]
          supplemental = [
              'foundry',
              'red-wash-mine',
              'blood-sweat-and-tears-railway',
              'emberline',
              'red-wash-pale-sun',
          ]

          lines = [
              '# Sable Harbor Logo Index',
              '',
              'This page renders individual source files from `assets/brand/logos/`; it does not use a composite contact sheet.',
              '',
              'Business-line names and status remain controlled by `docs/canon/SABLE_HARBOR_CORPORATE_LORE_CANON_v0.2.md`. Artwork does not independently create canon.',
              '',
              '## Corporate and canonical 2026 business lines',
              '',
          ]
          for slug in core:
              meta = brand_meta[slug]
              lines += [
                  f'### {meta["name"]}',
                  '',
                  f'![{meta["name"]} primary horizontal](../../assets/brand/logos/{slug}__primary-horizontal.svg)',
                  '',
                  f'**Classification:** {meta["classification"]}  ',
                  f'**Files:** [`primary`](../../assets/brand/logos/{slug}__primary-horizontal.svg) · '
                  f'[`stacked`](../../assets/brand/logos/{slug}__stacked.svg) · '
                  f'[`mark`](../../assets/brand/logos/{slug}__mark.svg) · '
                  f'[`reverse`](../../assets/brand/logos/{slug}__reverse-horizontal.svg) · '
                  f'[`one-color`](../../assets/brand/logos/{slug}__one-color-horizontal.svg)',
                  '',
              ]
          lines += ['## Supplemental identities', '']
          for slug in supplemental:
              meta = brand_meta[slug]
              lines += [
                  f'### {meta["name"]}',
                  '',
                  f'![{meta["name"]} primary horizontal](../../assets/brand/logos/{slug}__primary-horizontal.svg)',
                  '',
                  f'**Classification:** {meta["classification"]}  ',
                  f'**Canon note:** {meta["status"]}  ',
                  f'**Files:** [`primary`](../../assets/brand/logos/{slug}__primary-horizontal.svg) · '
                  f'[`mark`](../../assets/brand/logos/{slug}__mark.svg) · '
                  f'[`reverse`](../../assets/brand/logos/{slug}__reverse-horizontal.svg)',
                  '',
              ]
          lines += [
              '## Complete package',
              '',
              '[Download the complete SVG and PNG package](../../assets/brand/packages/sable-harbor-logo-system-v0.1.0.zip).',
              '',
          ]
          (root / 'docs/brand/LOGO_INDEX.md').write_text('\n'.join(lines), encoding='utf-8')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          if '## Brand assets' not in text:
              text = text.rstrip() + (
                  '\n\n## Brand assets\n\n'
                  'The versioned corporate and business-line logo system is indexed in '
                  '[`docs/brand/LOGO_INDEX.md`](docs/brand/LOGO_INDEX.md). '
                  'Individual SVG and PNG assets are stored under [`assets/brand/logos/`](assets/brand/logos/), '
                  'with a complete downloadable package under [`assets/brand/packages/`](assets/brand/packages/).\n'
              )
              readme.write_text(text, encoding='utf-8')
          PY

      - name: Validate coverage and one-logo-per-file rule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('.')
          logos = root / 'assets/brand/logos'
          manifest = json.loads((root / 'assets/brand/manifest.json').read_text())
          svg = sorted(logos.glob('*.svg'))
          png = sorted(logos.glob('*.png'))
          if len(svg) != 55 or len(png) != 55:
              raise SystemExit(f'Expected 55 SVG and 55 PNG files; found {len(svg)} and {len(png)}')

          for asset in manifest['assets']:
              path = root / asset['path']
              if not path.exists():
                  raise SystemExit(f'Missing manifest asset: {path}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != asset['sha256']:
                  raise SystemExit(f'Digest mismatch: {path}')

          for path in svg:
              content = path.read_text(encoding='utf-8').lower()
              if content.count('<svg') != 1 or '<text' in content:
                  raise SystemExit(f'Invalid SVG production file: {path}')

          core = [
              'sable-harbor', 'foundry-field', 'willow', 'atlas-meridian',
              'pale-sun', 'project-cradle', 'american-resource-utility', 'advisory',
          ]
          for slug in core:
              variants = {a['variant'] for a in manifest['assets'] if a['brand_slug'] == slug}
              if len(variants) != 5:
                  raise SystemExit(f'Expected five variants for {slug}; got {sorted(variants)}')
          print('PASS: 55 individual logos, 110 format files, five variants for each core identity.')
          PY

      - name: Commit the complete brand package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .brand-build .brand-materialization brand-build-result.json
          rm .github/workflows/build-sable-harbor-brand-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Sable Harbor corporate and business-line logo system"
          git push origin HEAD:brand/logo-system-v0.1
