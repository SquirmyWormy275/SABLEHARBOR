name: Runtime estate integration
on:
  pull_request:
    paths:
      - enterprise/runtime/**
      - geospatial/facilities/**
      - enterprise/services/**
      - enterprise/operations/**
      - enterprise/business/**
      - industrial/planning/**
      - docs/canon/RUNTIME_*
      - docs/facilities/NORTHERN_NEVADA_*
      - .github/workflows/runtime-estate.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconcile:
    name: Runtime Estate / reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.4'
          python-version: '3.12'
      - run: uv sync --frozen --all-extras
      - run: uv run python -m pytest enterprise/runtime/tests enterprise/services/tests
      - run: uv run python -m enterprise.runtime.model build --output /tmp/runtime-registers --database
      - run: uv run python -m enterprise.runtime.report --verify
      - run: uv run python -m enterprise.runtime.verify --runtime-output /tmp/runtime-registers/runtime.json
      - run: uv run python -m enterprise.runtime.build_finance
      - run: uv run python -m enterprise.runtime.workbook --output enterprise/runtime/publications --verify
      - name: Reproduce integrated runtime output
        run: |
          cp enterprise/generated/runtime-v1/manifest.json /tmp/runtime-first-manifest.json
          uv run python -m enterprise.runtime.build_finance
          diff -u /tmp/runtime-first-manifest.json enterprise/generated/runtime-v1/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-estate-financial-evidence
          path: |
            enterprise/generated/runtime-v1
            /tmp/runtime-registers
          if-no-files-found: error
