name: Closeout reference evidence
on:
  pull_request:
    paths:
      - 'tools/evidence/**'
      - 'tests/evidence/**'
      - 'evidence/closeout/**'
      - '.github/workflows/closeout-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - run: make bootstrap
      - run: uv run python -m pytest tests/evidence -q
      - run: uv run python -m tools.evidence.closeout --output var/closeout-evidence
      - run: uv run python -m tools.evidence.closeout --verify var/closeout-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: closeout-reference-evidence
          path: var/closeout-evidence*
          if-no-files-found: error
