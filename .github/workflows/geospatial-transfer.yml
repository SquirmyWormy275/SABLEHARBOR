name: Materialize reviewed Geo files
on:
  push:
    branches: [geo/canon-reconciliation-2026-09-07]
    paths: ['.geospatial-transfer/**']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify transfer and commit exact reviewed source tree
        run: python .geospatial-transfer/materialize.py
