name: Blackridge data foundation CI
on:
  pull_request:
    paths: ["blackridge/**", ".github/workflows/blackridge-ci.yml"]
  push:
    branches: ["blackridge/**"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install -e 'blackridge[dev]'
      - run: ruff check blackridge/src blackridge/tests
      - run: pytest -q blackridge/tests
      - run: python -m blackridge generate --profile smoke --seed 20150112
      - run: python -m blackridge generate --profile m00 --seed 20150112
      - run: python -m blackridge validate --profile m00

