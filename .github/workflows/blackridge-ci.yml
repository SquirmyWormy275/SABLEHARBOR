name: Blackridge data foundation CI
on:
  pull_request:
    paths: ["blackridge/**", ".github/workflows/blackridge-ci.yml"]
  push:
    branches: ["blackridge/**"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: blackridge_test
          POSTGRES_DB: blackridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d blackridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install -e 'blackridge[dev]'
      - run: ruff check blackridge/src blackridge/tests
      - run: pytest -q blackridge/tests
      - run: cd blackridge && alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: psql -h localhost -U postgres -d blackridge -v ON_ERROR_STOP=1 -f blackridge/schemas/sql/blackridge_postgresql_v0.1.0.sql
        env: {PGPASSWORD: blackridge_test}
      - run: python -m blackridge generate --profile smoke --seed 20150112
      - run: python -m blackridge generate --profile m00 --seed 20150112
      - run: python -m blackridge validate --profile m00
      - run: python -m blackridge replay --profile m00 --seed 20150112
