name: Fix canon grammar

on:
  push:
    branches:
      - canon/corporate-lore-v0.2
    paths:
      - .github/workflows/fix-canon-grammar.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/corporate-lore-v0.2
      - name: Correct one sentence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/canon/SABLE_HARBOR_CORPORATE_LORE_CANON_v0.2.md')
          text = p.read_text(encoding='utf-8')
          old = 'Willow does not give him an literally unlimited budget, but from his prior experience the resources and trust feel almost unconstrained.'
          new = 'Willow does not give him an unlimited budget, but from his prior experience the resources and trust feel almost unconstrained.'
          if text.count(old) != 1:
              raise SystemExit('Expected sentence was not found exactly once.')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name 'Sable Harbor Canon Bot'
          git config user.email 'sable-harbor-canon-bot@users.noreply.github.com'
          git add docs/canon/SABLE_HARBOR_CORPORATE_LORE_CANON_v0.2.md
          git commit -m 'Fix grammar in corporate lore canon'
          git push origin HEAD:canon/corporate-lore-v0.2
