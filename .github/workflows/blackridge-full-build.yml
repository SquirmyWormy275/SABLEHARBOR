name: Blackridge full 2015 build
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 1 * *"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Blackridge Full Build / build
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 lacks Playwright and bwrap AppArmor support
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -e 'blackridge[dev]'
      - run: python -m blackridge generate --profile full_2015 --seed 20150112
      - run: python -m blackridge export all --profile full_2015
      - run: python -m blackridge workbook-qa
      - run: python -m blackridge query --database blackridge/data/public/databases/blackridge_public_v0.1.0.sqlite3 --sql-file blackridge/queries/blackridge_query_cookbook_v0.1.0.sql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blackridge-public-v0.1.0
          path: |
            blackridge/data/public/
            blackridge/reports/
