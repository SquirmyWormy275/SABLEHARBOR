name: Red Wash transaction and operating record

on:
  push:
    branches: [main]
    paths:
      - RED_WASH.md
      - red_wash/**
      - industrial/**
      - docs/**
      - assets/brand/**
      - tools/documents/**
      - scripts/check_public_safety.py
      - src/sable_harbor/exports/safety.py
      - .github/workflows/red-wash-case-ci.yml
  pull_request:
    paths:
      - RED_WASH.md
      - red_wash/**
      - industrial/**
      - docs/**
      - assets/brand/**
      - tools/documents/**
      - scripts/check_public_safety.py
      - src/sable_harbor/exports/safety.py
      - .github/workflows/red-wash-case-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: red-wash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build deterministic Red Wash package
        run: python red_wash/tools/build_red_wash_package.py
      - name: Validate reconciliations, provenance, database, and visual hashes
        run: python red_wash/tools/validate_red_wash_record.py
      - name: Run Red Wash tests
        run: python -m unittest discover -s red_wash/tests -p 'test_*.py' -v
      - name: Prove repeat build stability
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          roots = (Path("red_wash/generated"), Path("red_wash/dist"))

          def hashes():
              return {
                  path.as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
                  for root in roots
                  for path in sorted(root.iterdir())
                  if path.is_file()
              }

          before = hashes()
          subprocess.run(
              ["python", "red_wash/tools/build_red_wash_package.py"], check=True
          )
          after = hashes()
          if before != after:
              changed = sorted(set(before) | set(after))
              raise SystemExit(f"repeat build changed generated outputs: {changed}")
          PY
      - name: Build current participant corpus from the clean source revision
        run: python industrial/tools/build_package.py
      - name: Verify source binding and safely extract the selected participant archive
        id: participant
        run: |
          python - <<'PYCODE'
          import hashlib
          import json
          import os
          import stat
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          repository = Path.cwd().resolve()
          dist = repository / "industrial/dist"
          validation = json.loads((dist / "validation.json").read_text())
          if validation["status"] != "PASS" or validation["source_state"] != "CLEAN_COMMIT":
              raise SystemExit("participant build is not a validated clean-source artifact")
          if validation["source_revision"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("participant source revision differs from the checked-out CI revision")
          archive_path = (repository / validation["zip_path"]).resolve()
          if not archive_path.is_relative_to(dist) or not archive_path.is_file():
              raise SystemExit("participant archive is outside the expected distribution directory")
          if hashlib.sha256(archive_path.read_bytes()).hexdigest() != validation["zip_sha256"]:
              raise SystemExit("participant archive checksum differs from build validation")

          # Staging must remain outside the checkout: a review artifact must not
          # dirty the source revision used by the clean-commit package builder.
          stage = Path(tempfile.mkdtemp(prefix="industrial-participant-ci-", dir=os.environ["RUNNER_TEMP"]))
          if stage.resolve().is_relative_to(repository):
              raise SystemExit("participant staging must be outside the source checkout")
          with zipfile.ZipFile(archive_path) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("participant archive CRC validation failed")
              members = archive.infolist()
              names = [member.filename for member in members]
              if len(names) != len(set(names)):
                  raise SystemExit("participant archive contains duplicate member names")
              for member in members:
                  path = PurePosixPath(member.filename)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or "\\" in member.filename
                      or member.is_dir()
                      or stat.S_ISLNK(member.external_attr >> 16)
                      or not member.filename
                  ):
                      raise SystemExit(f"unsafe participant archive member: {member.filename}")
              manifest = json.loads(archive.read("manifest.json"))
              if (
                  manifest["source_revision"] != os.environ["GITHUB_SHA"]
                  or manifest["source_state"] != "CLEAN_COMMIT"
                  or manifest["editorial_handoff_included"]
                  or manifest["private_assessment_material_included"]
              ):
                  raise SystemExit("participant manifest source/classification boundary failed")
              expected = {entry["path"] for entry in manifest["artifacts"]}
              expected.update({manifest["database"]["path"], "README.md", "manifest.json", "CHECKSUMS.sha256"})
              if set(names) != expected:
                  raise SystemExit("archive members differ from the reviewed participant manifest")
              checksums = {}
              for line in archive.read("CHECKSUMS.sha256").decode().splitlines():
                  checksum, name = line.split("  ", 1)
                  if name in checksums:
                      raise SystemExit("duplicate participant checksum entry")
                  checksums[name] = checksum
              if set(checksums) != set(names) - {"CHECKSUMS.sha256"}:
                  raise SystemExit("participant checksum inventory is incomplete")
              for name, checksum in checksums.items():
                  if hashlib.sha256(archive.read(name)).hexdigest() != checksum:
                      raise SystemExit(f"participant member checksum mismatch: {name}")
              for member in members:
                  target = stage / member.filename
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(member))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"stage={stage}\n")
          print(f"Verified {len(members)} participant members from {manifest['source_revision']}")
          PYCODE
      - name: Scan selected public content and binary containers
        env:
          PARTICIPANT_STAGE: ${{ steps.participant.outputs.stage }}
        run: PYTHONPATH=src python scripts/check_public_safety.py "$PARTICIPANT_STAGE"
      - name: Upload source-bound CI review artifact
        # This is an Actions review artifact, not a GitHub Release publication.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: industrial-participant-ci-${{ github.sha }}
          path: industrial/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
