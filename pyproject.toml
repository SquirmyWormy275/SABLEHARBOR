[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sable-harbor-finance"
version = "0.1.0"
description = "Sable Harbor enterprise financial data platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "xlsxwriter>=3.2,<4"
]

[project.optional-dependencies]
dev = [
  "PyMuPDF==1.26.7",
  "pypdf==6.19.0",
  "markdown-it-py==4.2.0",
  "mypy>=1.11,<2",
  "openpyxl>=3.1,<4",
  "pytest>=9.0.3,<10",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7"
]
postgres = ["psycopg[binary]>=3.2,<4"]
ccf-service = [
    "gunicorn>=26.2,<27 ; python_full_version >= '3.12'",
    "pyjwt[crypto]>=2.15.0,<3",
]
audit-suite = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "pymupdf==1.26.7",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
shfin = "sable_harbor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sable_harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py", "enterprise/audit_suite/**/*.py", "tools/audit_suite/**/*.py"]
extend-exclude = ["blackridge", "geospatial"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sable_harbor"]

# Retained audit histories admit these exact reviewed sources. CI verifies their
# SHA-256 pins separately; do not rewrite them through automatic style cleanup.
[tool.ruff.format]
exclude = [
  "enterprise/audit_suite/compact_prefix_storage.py",
  "enterprise/audit_suite/company_source_edition.py",
  "enterprise/audit_suite/fictional_2027_source_portfolio.py",
  "enterprise/audit_suite/full_scope_company_pair.py",
  "enterprise/audit_suite/history_integrity_reference.py",
  "enterprise/audit_suite/instructor_assessments.py",
  "enterprise/audit_suite/instructor_comparison.py",
  "enterprise/audit_suite/instructor_debrief.py",
  "enterprise/audit_suite/managed_history_integrity.py",
  "enterprise/audit_suite/persistent_company_journey.py",
  "enterprise/audit_suite/persistent_company_service.py",
  "enterprise/audit_suite/retained_explanation_service.py",
  "enterprise/audit_suite/sealed_history_authority.py",
  "enterprise/audit_suite/sealed_history_inspection.py",
  "enterprise/audit_suite/sealed_history_store.py",
  "enterprise/audit_suite/sealed_retained_service.py",
  "enterprise/audit_suite/service.py",
  "enterprise/audit_suite/source_library_security_execution.py",
  "enterprise/audit_suite/source_native_operating_methods.py",
  "enterprise/audit_suite/source_workforce_efficient_methods.py",
  "enterprise/audit_suite/source_workforce_methods.py"
]

[tool.ruff.lint.per-file-ignores]
"enterprise/audit_suite/compact_prefix_storage.py" = ["B905", "E501", "E731"]
"enterprise/audit_suite/company_source_edition.py" = ["B007", "E501", "I001"]
"enterprise/audit_suite/history_integrity_reference.py" = ["E501"]
"enterprise/audit_suite/instructor_assessments.py" = ["E501", "I001"]
"enterprise/audit_suite/instructor_comparison.py" = ["E501"]
"enterprise/audit_suite/instructor_debrief.py" = ["E402", "E501", "F401", "I001"]
"enterprise/audit_suite/managed_history_integrity.py" = ["E501", "E701", "E702", "F401", "I001"]
"enterprise/audit_suite/retained_explanation_service.py" = ["E501"]
"enterprise/audit_suite/sealed_history_store.py" = ["E731"]
"enterprise/audit_suite/service.py" = ["E501"]
