<text x="50.00" y="704.00" class="label" >HOW TO READ THIS HISTORY</text>
<text x="50.00" y="733.00" class="small" >Dashed brown: unlocated coal-era reconstruction. Navy: derived 1968 mainline. Ochre: 1972 East. Green: 1986 Mineral.</text>
<text x="50.00" y="759.00" class="small" >The 14–16-mile range belongs to the surviving 1954 estate; it is not a precise 1898 length or a surveyed old boundary.</text>
<text x="50.00" y="785.00" class="small" >1968 net route growth is about 17.35–19.35 miles; gross new construction and realigned old mileage are not established.</text>
<text x="50.00" y="811.00" class="small" >1972 total: 37.3485 miles. 1986, 1991 and current total: 40.0000. Parallel yard tracks add no unique route-miles.</text>
<text x="50.00" y="837.00" class="small" >Red Wash is absent from every rail epoch: ordinary mine receipts use trucks, and direct uranium custody remains gated.</text>
<text x="50.00" y="890.00" class="small" >CRS / scale: logical schematic canvas, not georeferenced. North and a ground-distance scale cannot be established for the early estate.</text>
<text x="50.00" y="917.00" class="small" >Sources: controlled history and source/operations.json historical_route_epochs; current geographic geometry is separately published in bst_network.svg.</text>
<text x="50.00" y="944.00" class="small" >Fictional reconstruction. Exact extension dates are declared case derivations; no historical survey, mapped property right or professional certification is claimed.</text>
