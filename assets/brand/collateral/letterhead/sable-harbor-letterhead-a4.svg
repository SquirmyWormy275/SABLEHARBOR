<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title id="title">Sable Harbor letterhead - a4</title><desc id="desc">Editable corporate letterhead with explicit contact placeholders.</desc><rect x="0" y="0" width="794" height="1123" fill="#F4F1EA"/><image href="data:image/svg+xml;base64," x="54" y="40" width="400" height="125" preserveAspectRatio="xMinYMid meet"/><rect x="54" y="164" width="686" height="3" fill="#C45124"/><text x="740" y="80" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#101214">CORPORATE CORRESPONDENCE</text><text x="740" y="104" text-anchor="end" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.2" fill="#747A80">[DATE]  |  [REFERENCE]</text><text x="54" y="218" font-family="Arial, sans-serif" font-size="12" fill="#747A80">[RECIPIENT NAME]</text><text x="54" y="238" font-family="Arial, sans-serif" font-size="12" fill="#747A80">[ORGANIZATION]</text><text x="54" y="258" font-family="Arial, sans-serif" font-size="12" fill="#747A80">[ADDRESS]</text><text x="54" y="314" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#101214">[SUBJECT]</text><text x="54" y="354" font-family="Arial, sans-serif" font-size="12" fill="#101214">[LETTER BODY BEGINS HERE]</text><rect x="54" y="1051" width="686" height="2" fill="#C45124"/><text x="54" y="1079" font-family="Arial, sans-serif" font-size="9" letter-spacing="0.7" fill="#747A80">[ADDRESS]  |  [EMAIL]  |  [PHONE]  |  [WEB]</text><text x="740" y="1079" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#747A80">SABLE HARBOR</text></svg>