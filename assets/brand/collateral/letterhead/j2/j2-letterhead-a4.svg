<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">J2 Judgment &amp; Junction letterhead — A4</title>
<desc id="desc">Controlled Sable Harbor J2 A4 letterhead using the approved J2 horizontal identity.</desc>
<rect width="794" height="1123" fill="#F4F1EA"/>
<image href="../../../logos/j2__primary-horizontal.png" x="52" y="36" width="350" height="175" preserveAspectRatio="xMinYMin meet"/>
<text x="742" y="78" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#101214">JUDGMENT &amp; JUNCTION</text>
<text x="742" y="103" text-anchor="end" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.1" fill="#747A80">[DATE]  |  [REFERENCE]</text>
<rect x="52" y="177" width="690" height="3" fill="#BE0E0C"/>
<text x="52" y="232" font-family="Arial, sans-serif" font-size="12" fill="#747A80">[RECIPIENT / DISTRIBUTION]</text>
<text x="52" y="254" font-family="Arial, sans-serif" font-size="12" fill="#747A80">[ORGANIZATION / BUSINESS LINE]</text>
<text x="52" y="320" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#101214">[SUBJECT]</text>
<text x="52" y="364" font-family="Arial, sans-serif" font-size="12" fill="#101214">[DOCUMENT BODY BEGINS HERE]</text>
<rect x="52" y="1053" width="690" height="2" fill="#BE0E0C"/>
<text x="52" y="1081" font-family="Arial, sans-serif" font-size="9" letter-spacing="0.7" fill="#747A80">[CLASSIFICATION]  |  [DOCUMENT ID]  |  [VERSION]</text>
<text x="742" y="1081" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#747A80">SABLE HARBOR  |  J2</text>
</svg>
