<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056" role="img" aria-labelledby="title desc">
<title id="title">Atlas Meridian letterhead — US Letter</title>
<desc id="desc">Linked-logo working letterhead template with explicit placeholders and no invented contact information.</desc>
<rect width="816" height="1056" fill="#F4F1EA"/>
<image href="https://raw.githubusercontent.com/SquirmyWormy275/SABLEHARBOR/main/assets/brand/logos/atlas-meridian__primary-horizontal.svg" x="54" y="38" width="420" height="132" preserveAspectRatio="xMinYMid meet"/>
<text x="762" y="78" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.7" fill="#101214">ATLAS MERIDIAN</text>
<text x="762" y="102" text-anchor="end" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.2" fill="#747A80">[DATE]  |  [REFERENCE]</text>
<rect x="54" y="166" width="708" height="3" fill="#C45124"/>
<text x="54" y="220" font-family="Arial, sans-serif" font-size="12" fill="#747A80">[RECIPIENT NAME]</text>
<text x="54" y="241" font-family="Arial, sans-serif" font-size="12" fill="#747A80">[ORGANIZATION]</text>
<text x="54" y="262" font-family="Arial, sans-serif" font-size="12" fill="#747A80">[ADDRESS]</text>
<text x="54" y="320" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#101214">[SUBJECT]</text>
<text x="54" y="362" font-family="Arial, sans-serif" font-size="12" fill="#101214">[LETTER BODY BEGINS HERE]</text>
<line x1="54" y1="982" x2="762" y2="982" stroke="#C45124" stroke-width="2"/>
<text x="54" y="1008" font-family="Arial, sans-serif" font-size="9" fill="#747A80">SABLE HARBOR BUSINESS-LINE TEMPLATE • [ADDRESS] • [EMAIL] • [TELEPHONE] • [DOMAIN]</text>
<text x="762" y="1030" text-anchor="end" font-family="Arial, sans-serif" font-size="8" fill="#747A80">LINKED LOGO SOURCE • REVIEW BEFORE EXTERNAL USE</text>
</svg>
