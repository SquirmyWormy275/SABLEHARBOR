<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title id="title">Sable Harbor report cover - a4</title><desc id="desc">Corporate report-cover template with explicit document-control placeholders.</desc><rect x="0" y="0" width="794" height="1123" fill="#F4F1EA"/><rect x="0" y="0" width="794" height="494" fill="#101419"/><image href="data:image/svg+xml;base64," x="52" y="134" width="690" height="210" preserveAspectRatio="xMinYMid meet"/><rect x="52" y="488" width="690" height="6" fill="#C45124"/><text x="52" y="640" font-family="Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="1.5" fill="#101214">[REPORT TITLE]</text><text x="52" y="696" font-family="Arial, sans-serif" font-size="18" letter-spacing="1" fill="#747A80">[REPORT SUBTITLE OR ENGAGEMENT]</text><text x="52" y="842" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#101214">DOCUMENT CONTROL</text><text x="52" y="887" font-family="Arial, sans-serif" font-size="11" fill="#747A80">DATE</text><text x="170" y="887" font-family="Arial, sans-serif" font-size="11" fill="#101214">[DATE]</text><text x="52" y="920" font-family="Arial, sans-serif" font-size="11" fill="#747A80">VERSION</text><text x="170" y="920" font-family="Arial, sans-serif" font-size="11" fill="#101214">[VERSION]</text><text x="52" y="954" font-family="Arial, sans-serif" font-size="11" fill="#747A80">CLASSIFICATION</text><text x="170" y="954" font-family="Arial, sans-serif" font-size="11" fill="#101214">[CLASSIFICATION]</text><rect x="52" y="1053" width="690" height="2" fill="#C45124"/><text x="52" y="1081" font-family="Arial, sans-serif" font-size="9" letter-spacing="1" fill="#747A80">SABLE HARBOR  |  CONTROLLED DOCUMENT TEMPLATE</text></svg>