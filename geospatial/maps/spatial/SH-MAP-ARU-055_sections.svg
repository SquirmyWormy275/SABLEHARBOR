E FITOUT EXISTING FUNCTION</text><text x="2550" y="527.75" font-size="25" fill="#223740" font-weight="normal" text-anchor="start">NOT AS BUILT</text><text x="2550" y="615.5" font-size="25" fill="#223740" font-weight="bold" text-anchor="start">GEOMETRY</text><text x="2550" y="659.5" font-size="25" fill="#223740" font-weight="normal" text-anchor="start">program envelope</text><text x="2550" y="747.25" font-size="25" fill="#223740" font-weight="bold" text-anchor="start">HEIGHT BASIS</text><text x="2550" y="791.25" font-size="25" fill="#223740" font-weight="normal" text-anchor="start">Source floor height; still a modelled</text><text x="2550" y="825" font-size="25" fill="#223740" font-weight="normal" text-anchor="start">concept.</text><text x="2550" y="912.75" font-size="25" fill="#223740" font-weight="bold" text-anchor="start">DESIGN BOUNDARY</text><text x="2550" y="956.75" font-size="25" fill="#223740" font-weight="normal" text-anchor="start">Modelled study. Not surveyed, as-built,</text><text x="2550" y="990.5" font-size="25" fill="#223740" font-weight="normal" text-anchor="start">engineered or code-certified.</text><text x="2550" y="1078.25" font-size="25" fill="#223740" font-weight="bold" text-anchor="start">DIMENSIONS / METRES</text><text x="2550" y="1123.25" font-size="28" fill="#223740" font-weight="normal" text-anchor="start">42.00 × 24.00 m</text><text x="2550" y="1173.25" font-size="24" fill="#223740" font-weight="normal" text-anchor="start">Height 6.00 m + parapet 0.80 m</text><text x="150" y="440" font-size="32" fill="#223740" font-weight="bold" text-anchor="start">X–X / EAST–WEST CUT</text><path d="M215,990 L2335,990" fill="none" stroke="#223740" stroke-width="4"/><rect x="250" y="697.143" width="2050" height="292.857" fill="#ffffff" stroke="#223740" stroke-width="2"/><rect x="250" y="975.357" width="2050" height="14.6429" fill="#e7e9e5" stroke="#223740" stroke-width="1"/><text x="145" y="978" font-size="21" fill="#223740" font-weight="normal" text-anchor=