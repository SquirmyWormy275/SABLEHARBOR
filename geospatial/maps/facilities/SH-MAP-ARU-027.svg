<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:DejaVu Sans,sans-serif;fill:#172e40} .muted{fill:#637078}</style><rect x="0" y="0" width="1600" height="1000" fill="#faf9f5" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1600" height="95" fill="#172e40" stroke="none" stroke-width="1"/><text x="45" y="47" font-size="25" font-weight="bold" text-anchor="start" style="fill:white">SABLE HARBOR</text><text x="1555" y="43" font-size="19" font-weight="normal" text-anchor="end" style="fill:white">SH-MAP-ARU-027</text><text x="45" y="135" font-size="32" font-weight="bold" text-anchor="start" style="fill:#172e40">Taylor warehouse · master plan</text><text x="45" y="171" font-size="18" font-weight="normal" text-anchor="start" style="fill:#172e40">Concept spatial program; current geographic context remains separately sourced</text><text x="45" y="206" font-size="16" font-weight="normal" text-anchor="start" style="fill:#922d35">SYNTHETIC OPERATING</text><path d="M45,888 L1555,888" fill="none" stroke="#172e40" stroke-width="1"/><text x="45" y="919" font-size="16" font-weight="normal" text-anchor="start" style="fill:#172e40">11 SEP 2026  |  Rev 0.1.0  |  Concept design; not an occupied-building or construction record</text><text x="45" y="948" font-size="15" font-weight="normal" text-anchor="start" style="fill:#172e40">Local metric frame; reference north ↑  |  Not surveyed; do not scale the exported page</text><text x="45" y="975" font-size="13" font-weight="normal" text-anchor="start" style="fill:#172e40">Source: geospatial/facilities/source/industrial_facilities.json</text><rect x="70" y="245" width="605" height="605" fill="#f0f1e9" stroke="#24716d" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="114.832" y="760.336" width="432.362" height="67.2484" fill="#d8dcd9" stroke="#aab3ad" stroke-width="1.4"/><rect x="114.832" y="453.952" width="432.362" height="44.8322" fill="#d8dcd9" stroke="#aab3ad" stroke-