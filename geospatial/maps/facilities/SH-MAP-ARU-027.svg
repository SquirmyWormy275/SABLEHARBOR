art" style="fill:#172e40">0</text><text x="193.081" y="883" font-size="13" font-weight="normal" text-anchor="start" style="fill:#172e40">50 m</text><text x="950" y="265" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">SITE BASIS</text><text x="950" y="288" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Local east/north diagram using source acreage and aspect</text><text x="950" y="308" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">ratio; no survey transform. Original georeferenced polygon is</text><text x="950" y="328" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">retained by reference, never replaced. Proposed building</text><text x="950" y="348" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">placements are illustrative, not surveyed.</text><text x="950" y="386" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">PROGRAM</text><text x="950" y="409" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Known operating functions; schematic fit-out only.</text><text x="950" y="447" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">OWNERSHIP AND TIME</text><text x="950" y="470" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">American Resource Utility, Inc. — accepted synthetic owner,</text><text x="950" y="490" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">not real title evidence. Exact occupancy and construction</text><text x="950" y="510" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">dates remain unestablished.</text><text x="950" y="548" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">DEPENDENCIES</text><text x="950" y="571" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Local geometry does not relocate industrial anchors or create</text><text x="950" y="591" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">installed process equipment, transport rights or host</text><text x="950" y="611" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">ownership.</text><text x="950" y="649" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">CAPACITY</text><text x="950" y="672" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">People and seats are separate measures. See population bridge</text><text x="950" y="692" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">and source assumptions.</text><text x="900" y="821" font-size="14" font-weight="bold" text-anchor="start" style="fill:#172e40">ACCESS LEGEND</text><path d="M900,843 L928,843" fill="none" stroke="#9eaaa7" stroke-width="4"/><text x="936" y="847" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Service / emergency</text><path d="M1200,843 L1228,843" fill="none" stroke="#ae9d7b" stroke-width="4"/><text x="1236" y="847" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Public arrival</text><path d="M900,867 L928,867" fill="none" stroke="#24716d" stroke-width="4"/><text x="936" y="871" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Pedestrian</text><path d="M1200,867 L1228,867" fill="none" stroke="#922d35" stroke-width="4"/><text x="1236" y="871" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Controlled entry</text></svg>
