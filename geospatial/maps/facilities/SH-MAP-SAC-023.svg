<svg xmlns="http://www.w3.org/2000/svg" width="3240" height="2304" viewBox="0 0 3240 2304"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="3240" height="2304" fill="#f7f6f1" stroke="none" stroke-width="2"/><text x="108" y="107" font-size="42" fill="#223740" font-weight="bold" text-anchor="start" letter-spacing="11">SABLE HARBOR</text><text x="3133" y="102" font-size="28" fill="#223740" font-weight="normal" text-anchor="end">SACRAMENTO / INSTITUTIONAL CAMPUS</text><path d="M107,149 L3135,149" fill="none" stroke="#223740" stroke-width="3"/><text x="108" y="249" font-size="62.5" fill="#223740" font-weight="bold" text-anchor="start">CORPORATE / BUILDING PROGRAM</text><text x="108" y="313" font-size="31" fill="#687b80" font-weight="normal" text-anchor="start">Coordinated floor stack  •  Same footprint and fixed service cores</text><rect x="2645" y="203" width="489" height="64" fill="#223740" stroke="none" stroke-width="2"/><text x="2890" y="241" font-size="26" fill="white" font-weight="bold" text-anchor="middle">CONCEPT REVIEW / R02</text><path d="M107,2147 L3135,2147" fill="none" stroke="#223740" stroke-width="3"/><text x="108" y="2205" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">COORDINATED DESIGN STUDY  •  11 SEPTEMBER 2026</text><text x="108" y="2248" font-size="23" fill="#687b80" font-weight="normal" text-anchor="start">Concept geometry; parcel, engineering and code review remain open. Areas and seats are design proposals.</text><text x="3133" y="2216" font-size="44" fill="#223740" font-weight="bold" text-anchor="end">SH-MAP-SAC-023</text><text x="3133" y="2267" font-size="22" fill="#687b80" font-weight="normal" text-anchor="end">BUILDING PROGRAM / R02</text><rect x="133" y="530" width="2176" height="300" fill="#e3edf0" stroke="#223740" stroke-width="3"/><text x="178" y="595" font-size="38" fill="#223740" font-weight="bold" text-anchor="start">L03 / CORPORATE OFFICERS / ESS / INDEPENDENT INTERNAL AUDIT</text><text x="178" y="650" font-size="29" fill="#687b80" font-weight="normal" text-anchor="start">23,328 gross sq ft  /  48 workplaces  /  48 planned peak</text><text x="178" y="715" font-size="26" fill="#223740" font-weight="normal" text-anchor="start">Finance · People and Culture · Legal / Compliance / Risk · Procurement / Facilities / Quality · Corporate officers and executive operations · Independent Internal</text><text x="178" y="754" font-size="26" fill="#223740" font-weight="normal" text-anchor="start">Audit suite · Technology / Security / Resilience</text><rect x="133" y="880" width="2176" height="300" fill="#e3edf0" stroke="#223740" stroke-width="3"/><text x="178" y="945" font-size="38" fill="#223740" font-weight="bold" text-anchor="start">L02 / PRODUCT ENGINEERING AND DEPLOYMENT</text><text x="178" y="1000" font-size="29" fill="#687b80" font-weight="normal" text-anchor="start">23,328 gross sq ft  /  112 workplaces  /  112 planned peak</text><text x="178" y="1065" font-size="26" fill="#223740" font-weight="normal" text-anchor="start">Foundry Field west studio · Foundry Field south studio · Atlas Meridian product development</text><rect x="133" y="1230" width="2176" height="300" fill="#e3edf0" stroke="#223740" stroke-width="3"/><text x="178" y="1295" font-size="38" fill="#223740" font-weight="bold" text-anchor="start">L01 / ADVISORY / CLIENT RECEPTION / CORPORATE COMMONS</text><text x="178" y="1350" font-size="29" fill="#687b80" font-weight="normal" text-anchor="start">23,328 gross sq ft  /  40 workplaces  /  52 planned peak</text><text x="178" y="1415" font-size="26" fill="#223740" font-weight="normal" text-anchor="start">Advisory common bench · Corporate commons / 80 dining seats · Client reception and hospitality · Visiting workplaces</text><path d="M2483,430 L3133,430" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="465" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">PROGRAM</text><text x="2483" y="513" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">3 floors / 69,984 gross sq ft. Staff</text><text x="2483" y="553.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">workplaces, training, meeting, dining</text><text x="2483" y="594" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">and residence remain separate</text><text x="2483" y="634.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">capacities.</text><path d="M2483,715 L3133,715" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="750" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">STRUCTURE / SERVICES</text><text x="2483" y="798" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Coordinated concept structural planning</text><text x="2483" y="838.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">grid; exact member sizes and loads</text><text x="2483" y="879" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">unengineered. Fixed stairs, lifts,</text><text x="2483" y="919.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">risers and wet cores preserved on every</text><text x="2483" y="960" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">level.</text><path d="M2483,1040.5 L3133,1040.5" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="1075.5" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">CORE COORDINATION</text><text x="2483" y="1123.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Explicit R01-based north-up core</text><text x="2483" y="1164" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">geometry; no automatic end-core</text><text x="2483" y="1204.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">overlay. All floor areas partition into</text><text x="2483" y="1245" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">rooms, fixed cores and circulation.</text><path d="M2483,1325.5 L3133,1325.5" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="1360.5" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">SEPTEMBER 2026</text><text x="2483" y="1408.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Concept design only. Parcel, tenure,</text><text x="2483" y="1449" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">permit, construction and occupancy</text><text x="2483" y="1489.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">evidence remain separate. No completed</text><text x="2483" y="1530" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">facility is asserted.</text><text x="137" y="1840" font-size="30" fill="#3f7088" font-weight="bold" text-anchor="start">01</text><text x="209" y="1840" font-size="29" fill="#223740" font-weight="bold" text-anchor="start">ONE BUILDING</text><text x="209" y="1886" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">Floorplates and service shafts align vertically. Detailed</text><text x="209" y="1926.5" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">engineering and fire strategy remain coordinated design</text><text x="209" y="1967" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">dependencies.</text><text x="162" y="2080" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">SH-SITE-0001-A / LOCAL CONCEPT STACK / NOT TO SCALE</text></svg>
