<svg xmlns="http://www.w3.org/2000/svg" width="3240" height="2304" viewBox="0 0 3240 2304"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="3240" height="2304" fill="#f7f6f1" stroke="none" stroke-width="2"/><text x="108" y="107" font-size="42" fill="#223740" font-weight="bold" text-anchor="start" letter-spacing="11">SABLE HARBOR</text><text x="3133" y="102" font-size="28" fill="#223740" font-weight="normal" text-anchor="end">RED WASH SURFACE STUDY ENVELOPE / FACILITY STUDY</text><path d="M107,149 L3135,149" fill="none" stroke="#223740" stroke-width="3"/><text x="108" y="249" font-size="62.5" fill="#223740" font-weight="bold" text-anchor="start">RED WASH SURFACE STUDY ENVELOPE</text><text x="108" y="313" font-size="31" fill="#687b80" font-weight="normal" text-anchor="start">Operating context and local planning envelope  •  Reference north is up</text><rect x="2645" y="203" width="489" height="64" fill="#223740" stroke="none" stroke-width="2"/><text x="2890" y="241" font-size="26" fill="white" font-weight="bold" text-anchor="middle">CONCEPT REVIEW / R02</text><path d="M107,2147 L3135,2147" fill="none" stroke="#223740" stroke-width="3"/><text x="108" y="2205" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">COORDINATED DESIGN STUDY  •  11 SEPTEMBER 2026</text><text x="108" y="2248" font-size="23" fill="#687b80" font-weight="normal" text-anchor="start">Concept geometry; parcel, engineering and code review remain open. Areas and seats are design proposals.</text><text x="3133" y="2216" font-size="44" fill="#223740" font-weight="bold" text-anchor="end">SH-MAP-RWM-021</text><text x="3133" y="2267" font-size="22" fill="#687b80" font-weight="normal" text-anchor="end">MASTER PLAN / R02</text><rect x="120" y="427" width="2040" height="1632" fill="#ebeee6" stroke="#223740" stroke-width="3"/><rect x="181.2" y="488.2" width="1917.6" height="1509.6" fill="#e7e9e5" stroke="#a7b5ae" stroke-width="1.5"/><text x="1140" y="1243" font