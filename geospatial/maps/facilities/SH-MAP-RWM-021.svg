quipment fabricated.</text><rect x="158" y="2088" width="77.724" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="235.724" y="2088" width="77.724" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><rect x="313.448" y="2088" width="77.724" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="391.172" y="2088" width="77.724" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><text x="158" y="2132" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">0</text><text x="313.448" y="2132" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">250</text><text x="468.896" y="2132" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">500</text><text x="498.896" y="2104" font-size="21" fill="#687b80" font-weight="normal" text-anchor="start">FEET</text><text x="900" y="2116" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">Planning envelope / Reference north / Geometry and tenure status remain separate</text><text x="2483" y="2050" font-size="18" fill="#687b80" font-weight="normal" text-anchor="start">SH-SITE-0006 / SH-MAP-RWM-021</text></svg>
