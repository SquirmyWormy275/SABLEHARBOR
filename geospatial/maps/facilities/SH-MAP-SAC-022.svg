<svg xmlns="http://www.w3.org/2000/svg" width="3240" height="2304" viewBox="0 0 3240 2304"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="3240" height="2304" fill="#f7f6f1" stroke="none" stroke-width="2"/><text x="108" y="107" font-size="42" fill="#223740" font-weight="bold" text-anchor="start" letter-spacing="11">SABLE HARBOR</text><text x="3133" y="102" font-size="28" fill="#223740" font-weight="normal" text-anchor="end">SACRAMENTO / INSTITUTIONAL CAMPUS</text><path d="M107,149 L3135,149" fill="none" stroke="#223740" stroke-width="3"/><text x="108" y="249" font-size="62.5" fill="#223740" font-weight="bold" text-anchor="start">CAMPUS / STATUS AND CAPACITY</text><text x="108" y="313" font-size="31" fill="#687b80" font-weight="normal" text-anchor="start">September 2026 evidence state  •  Planning horizons are not completion dates</text><rect x="2645" y="203" width="489" height="64" fill="#223740" stroke="none" stroke-width="2"/><text x="2890" y="241" font-size="26" fill="white" font-weight="bold" text-anchor="middle">CONCEPT REVIEW / R02</text><path d="M107,2147 L3135,2147" fill="none" stroke="#223740" stroke-width="3"/><text x="108" y="2205" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">COORDINATED DESIGN STUDY  •  11 SEPTEMBER 2026</text><text x="108" y="2248" font-size="23" fill="#687b80" font-weight="normal" text-anchor="start">Concept geometry; parcel, engineering and code review remain open. Areas and seats are design proposals.</text><text x="3133" y="2216" font-size="44" fill="#223740" font-weight="bold" text-anchor="end">SH-MAP-SAC-022</text><text x="3133" y="2267" font-size="22" fill="#687b80" font-weight="normal" text-anchor="end">STATUS AND PHASING / R02</text><path d="M133,468 L2310,468" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="133" y="510" font-size="40" fill="#3f7088" font-weight="bold" text-anchor="start">01</text><text x="240" y="510" font-size="33" fill="#223740" font-weight="bold" text-anchor="start">R01 VISUAL BASELINE</text><text x="240" y="565" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">APPROVED VISUAL REFERENCE</text><text x="240" y="620" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Four buildings, ten floors, 362 workplaces and 60 single rooms. Approval records a planning</text><text x="240" y="660.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">design, not land tenure or construction.</text><path d="M133,728 L2310,728" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="133" y="770" font-size="40" fill="#3f7088" font-weight="bold" text-anchor="start">02</text><text x="240" y="770" font-size="33" fill="#223740" font-weight="bold" text-anchor="start">R02 SOURCE AND FLOOR EXTENSIONS</text><text x="240" y="825" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">MODELLED DESIGN EXTENSION</text><text x="240" y="880" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Retain the approved master and three reference floors. Seven other floors are explicitly modelled</text><text x="240" y="920.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">design extensions with fixed stacked cores.</text><path d="M133,988 L2310,988" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="133" y="1030" font-size="40" fill="#3f7088" font-weight="bold" text-anchor="start">03</text><text x="240" y="1030" font-size="33" fill="#223740" font-weight="bold" text-anchor="start">PARCEL AND ENGINEERING</text><text x="240" y="1085" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">UNESTABLISHED</text><text x="240" y="1140" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Supported parcel, tenure, utilities, accessibility, transport demand and civil/structural/fire</text><text x="240" y="1180.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">engineering remain unresolved.</text><path d="M133,1248 L2310,1248" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="133" y="1290" font-size="40" fill="#3f7088" font-weight="bold" text-anchor="start">04</text><text x="240" y="1290" font-size="33" fill="#223740" font-weight="bold" text-anchor="start">PROCUREMENT, CONSTRUCTION AND OCCUPANCY</text><text x="240" y="1345" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">UNESTABLISHED</text><text x="240" y="1400" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">No procurement, permit, construction, fit-out or occupancy date is asserted. Execution requires</text><text x="240" y="1440.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">supported decisions and technical approvals.</text><path d="M133,1508 L2310,1508" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="133" y="1550" font-size="40" fill="#3f7088" font-weight="bold" text-anchor="start">05</text><text x="240" y="1550" font-size="33" fill="#223740" font-weight="bold" text-anchor="start">2031 AND 2036 CAPACITY REVIEW</text><text x="240" y="1605" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">CONDITIONAL HOLD FLAT CAPACITY</text><text x="240" y="1660" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Both planning horizons retain 362 fitted workplaces and 60 rooms. Future workforce growth and</text><text x="240" y="1700.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">additional floor capacity are unknown; no future construction is implied.</text><text x="2483" y="460" font-size="30" fill="#223740" font-weight="bold" text-anchor="start">SOURCE-BOUND STATUS</text><text x="2483" y="530" font-size="29" fill="#223740" font-weight="normal" text-anchor="start">R01 approved the drawing system and</text><text x="2483" y="573.5" font-size="29" fill="#223740" font-weight="normal" text-anchor="start">campus planning baseline. R02 extends</text><text x="2483" y="617" font-size="29" fill="#223740" font-weight="normal" text-anchor="start">the remaining floors and publication</text><text x="2483" y="660.5" font-size="29" fill="#223740" font-weight="normal" text-anchor="start">system. Neither approval is a land</text><text x="2483" y="704" font-size="29" fill="#223740" font-weight="normal" text-anchor="start">purchase, building permit, staffing</text><text x="2483" y="747.5" font-size="29" fill="#223740" font-weight="normal" text-anchor="start">authorization or completed</text><text x="2483" y="791" font-size="29" fill="#223740" font-weight="normal" text-anchor="start">construction record.</text><text x="2483" y="1050" font-size="29" fill="#223740" font-weight="normal" text-anchor="start">Actual dates remain null until</text><text x="2483" y="1093.5" font-size="29" fill="#223740" font-weight="normal" text-anchor="start">supported. Growth horizons reserve</text><text x="2483" y="1137" font-size="29" fill="#223740" font-weight="normal" text-anchor="start">choices; capacity changes require a</text><text x="2483" y="1180.5" font-size="29" fill="#223740" font-weight="normal" text-anchor="start">source-based successor and</text><text x="2483" y="1224" font-size="29" fill="#223740" font-weight="normal" text-anchor="start">transport/engineering review.</text><text x="160" y="2075" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">SH-SITE-0001 / SEPTEMBER 2026 / NO CONSTRUCTION COMPLETION ASSERTED</text></svg>
