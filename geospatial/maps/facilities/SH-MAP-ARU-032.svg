" y="388" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Desks, meeting places, beds and</text><text x="1200" y="408" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">training seats are distinct capacities;</text><text x="1200" y="428" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">do not add them as employees.</text><text x="1200" y="465" font-size="17" font-weight="bold" text-anchor="start" style="fill:#172e40">ACCESS</text><text x="1200" y="488" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Access follows room classification.</text><text x="1200" y="508" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Deliveries and equipment use service</text><text x="1200" y="528" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">routes.</text><text x="1200" y="565" font-size="17" font-weight="bold" text-anchor="start" style="fill:#172e40">DESIGN BASIS</text><text x="1200" y="588" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Planning assumptions. Final fire</text><text x="1200" y="608" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">strategy, structure, accessibility and</text><text x="1200" y="628" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">MEP require coordinated engineering.</text><text x="1200" y="665" font-size="17" font-weight="bold" text-anchor="start" style="fill:#172e40">STATUS</text><text x="1200" y="688" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Modelled fit-out; no existing floor,</text><text x="1200" y="708" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">tenure or occupancy asserted.</text></svg>
