<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:DejaVu Sans,sans-serif;fill:#172e40} .muted{fill:#637078}</style><rect x="0" y="0" width="1600" height="1000" fill="#faf9f5" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1600" height="95" fill="#172e40" stroke="none" stroke-width="1"/><text x="45" y="47" font-size="25" font-weight="bold" text-anchor="start" style="fill:white">SABLE HARBOR</text><text x="1555" y="43" font-size="19" font-weight="normal" text-anchor="end" style="fill:white">SH-MAP-ARU-021</text><text x="45" y="135" font-size="32" font-weight="bold" text-anchor="start" style="fill:#172e40">Taylor Yard and Shops · master plan</text><text x="45" y="171" font-size="18" font-weight="normal" text-anchor="start" style="fill:#172e40">Concept spatial program; current geographic context remains separately sourced</text><text x="45" y="206" font-size="16" font-weight="normal" text-anchor="start" style="fill:#922d35">SYNTHETIC OPERATING</text><path d="M45,888 L1555,888" fill="none" stroke="#172e40" stroke-width="1"/><text x="45" y="919" font-size="16" font-weight="normal" text-anchor="start" style="fill:#172e40">11 SEP 2026  |  Rev 0.1.0  |  Concept design; not an occupied-building or construction record</text><text x="45" y="948" font-size="15" font-weight="normal" text-anchor="start" style="fill:#172e40">Local metric frame; reference north ↑  |  Not surveyed; do not scale the exported page</text><text x="45" y="975" font-size="13" font-weight="normal" text-anchor="start" style="fill:#172e40">Source: geospatial/facilities/source/industrial_facilities.json</text><rect x="70" y="245" width="740" height="246.666" fill="#f0f1e9" stroke="#24716d" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="93.7447" y="268.745" width="692.511" height="104.198" fill="#d8dcd9" stroke="#aab3ad" stroke-width="1.4"/><path d="M79.4979,482.168 L800.502,482.168" fill="none" stroke="#9eaaa7" stroke-width="14"/><path d="M800.502,482.168 L800.502,254.498" fill="none" stroke="#9eaaa7" stroke-width="14"/><path d="M800.502,254.498 L79.4979,254.498" fill="none" stroke="#9eaaa7" stroke-width="14"/><path d="M79.4979,254.498 L79.4979,482.168" fill="none" stroke="#9eaaa7" stroke-width="14"/><path d="M255,491.666 L255,473.858" fill="none" stroke="#ae9d7b" stroke-width="8"/><path d="M662,491.666 L662,461.985" fill="none" stroke="#637078" stroke-width="6"/><rect x="95.7447" y="270.745" width="688.511" height="21" fill="#f0f1e9" stroke="none" stroke-width="1"/><text x="98.7447" y="283.745" font-size="11" font-weight="normal" text-anchor="start" style="fill:#172e40">Track estate — geometry in context view</text><rect x="111.553" y="415.683" width="71.2342" height="28.4937" fill="#172e40" stroke="#172e40" stroke-width="1.4"/><rect x="111.928" y="406.619" width="35" height="20" fill="#172e40" stroke="none" stroke-width="1"/><text x="113.928" y="421.619" font-size="15" font-weight="bold" text-anchor="start" style="fill:white">B01</text><path d="M111.553,425.93 L111.553,433.93" fill="none" stroke="white" stroke-width="3"/><path d="M182.788,425.93 L182.788,433.93" fill="none" stroke="white" stroke-width="3"/><rect x="206.532" y="422.807" width="42.7405" height="21.3703" fill="#172e40" stroke="#172e40" stroke-width="1.4"/><rect x="206.907" y="413.743" width="35" height="20" fill="#172e40" stroke="none" stroke-width="1"/><text x="208.907" y="428.743" font-size="15" font-weight="bold" text-anchor="start" style="fill:white">B02</text><path d="M206.532,429.492 L206.532,437.492" fill="none" stroke="white" stroke-width="3"/><path d="M249.273,429.492 L249.273,437.492" fill="none" stroke="white" stroke-width="3"/><path d="M845,305 L845,255" fill="none" stroke="#172e40" stroke-width="3"/><text x="845" y="244" font-size="18" font-weight="normal" text-anchor="middle" style="fill:#172e40">N</text><path d="M75,862 L134.362,862" fill="none" stroke="#172e40" stroke-width="4"/><text x="75" y="883" font-size="13" font-weight="normal" text-anchor="start" style="fill:#172e40">0</text><text x="140.362" y="883" font-size="13" font-weight="normal" text-anchor="start" style="fill:#172e40">50 m</text><text x="950" y="265" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">SITE BASIS</text><text x="950" y="288" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Local east/north diagram using source acreage and aspect</text><text x="950" y="308" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">ratio; no survey transform. Original georeferenced polygon is</text><text x="950" y="328" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">retained by reference, never replaced. Proposed building</text><text x="950" y="348" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">placements are illustrative, not surveyed.</text><text x="950" y="386" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">PROGRAM</text><text x="950" y="409" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Known operating functions; schematic fit-out only.</text><text x="950" y="447" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">OWNERSHIP AND TIME</text><text x="950" y="470" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Blood, Sweat &amp; Tears Railway Company — accepted synthetic</text><text x="950" y="490" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">owner, not real title evidence. Exact occupancy and</text><text x="950" y="510" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">construction dates remain unestablished.</text><text x="950" y="548" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">DEPENDENCIES</text><text x="950" y="571" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Local geometry does not relocate industrial anchors or create</text><text x="950" y="591" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">installed process equipment, transport rights or host</text><text x="950" y="611" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">ownership.</text><text x="950" y="649" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">CAPACITY</text><text x="950" y="672" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">People and seats are separate measures. See population bridge</text><text x="950" y="692" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">and source assumptions.</text><text x="900" y="821" font-size="14" font-weight="bold" text-anchor="start" style="fill:#172e40">ACCESS LEGEND</text><path d="M900,843 L928,843" fill="none" stroke="#9eaaa7" stroke-width="4"/><text x="936" y="847" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Service / emergency</text><path d="M1200,843 L1228,843" fill="none" stroke="#ae9d7b" stroke-width="4"/><text x="1236" y="847" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Public arrival</text><path d="M900,867 L928,867" fill="none" stroke="#24716d" stroke-width="4"/><text x="936" y="871" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Pedestrian</text><path d="M1200,867 L1228,867" fill="none" stroke="#922d35" stroke-width="4"/><text x="1236" y="871" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Controlled entry</text></svg>
