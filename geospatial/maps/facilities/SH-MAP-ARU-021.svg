<svg xmlns="http://www.w3.org/2000/svg" width="3240" height="2304" viewBox="0 0 3240 2304"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="3240" height="2304" fill="#f7f6f1" stroke="none" stroke-width="2"/><text x="108" y="107" font-size="42" fill="#223740" font-weight="bold" text-anchor="start" letter-spacing="11">SABLE HARBOR</text><text x="3133" y="102" font-size="28" fill="#223740" font-weight="normal" text-anchor="end">TAYLOR YARD AND SHOPS / FACILITY STUDY</text><path d="M107,149 L3135,149" fill="none" stroke="#223740" stroke-width="3"/><text x="108" y="249" font-size="62.5" fill="#223740" font-weight="bold" text-anchor="start">TAYLOR YARD AND SHOPS</text><text x="108" y="313" font-size="31" fill="#687b80" font-weight="normal" text-anchor="start">Operating context and local planning envelope  •  Reference north is up</text><rect x="2645" y="203" width="489" height="64" fill="#223740" stroke="none" stroke-width="2"/><text x="2890" y="241" font-size="26" fill="white" font-weight="bold" text-anchor="middle">CONCEPT REVIEW / R02</text><path d="M107,2147 L3135,2147" fill="none" stroke="#223740" stroke-width="3"/><text x="108" y="2205" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">COORDINATED DESIGN STUDY  •  11 SEPTEMBER 2026</text><text x="108" y="2248" font-size="23" fill="#687b80" font-weight="normal" text-anchor="start">Concept geometry; parcel, engineering and code review remain open. Areas and seats are design proposals.</text><text x="3133" y="2216" font-size="44" fill="#223740" font-weight="bold" text-anchor="end">SH-MAP-ARU-021</text><text x="3133" y="2267" font-size="22" fill="#687b80" font-weight="normal" text-anchor="end">MASTER PLAN / R02</text><rect x="120" y="427" width="2284" height="761.332" fill="#ebeee6" stroke="#223740" stroke-width="3"/><rect x="193.288" y="500.288" width="2137.42" height="321.605" fill="#e7e9e5" stroke="#a7b5ae" stroke-width="1.5"/><text x="1262" y="661.09" font-size="25" fill="#687b80" font-weight="bold" text-anchor="middle">TRACK ESTATE — GEOMETRY IN CONTEXT VIEW</text><path d="M149.315,1159.02 L2374.68,1159.02" fill="none" stroke="#bdc5c0" stroke-width="14"/><path d="M2374.68,1159.02 L2374.68,456.315" fill="none" stroke="#bdc5c0" stroke-width="14"/><path d="M2374.68,456.315 L149.315,456.315" fill="none" stroke="#bdc5c0" stroke-width="14"/><path d="M149.315,456.315 L149.315,1159.02" fill="none" stroke="#bdc5c0" stroke-width="14"/><path d="M691,1188.33 L691,1133.37" fill="none" stroke="#bdc5c0" stroke-width="14"/><path d="M1947.2,1188.33 L1947.2,1096.72" fill="none" stroke="#bdc5c0" stroke-width="14"/><rect x="256.254" y="961.811" width="219.863" height="87.9454" fill="#cdd5cb" stroke="none" stroke-width="2"/><rect x="248.254" y="953.811" width="219.863" height="87.9454" fill="white" stroke="#729085" stroke-width="5"/><rect x="248.254" y="953.811" width="21" height="87.9454" fill="#729085" stroke="none" stroke-width="2"/><rect x="251.254" y="956.811" width="70" height="35" fill="#223740" stroke="none" stroke-width="2"/><text x="256.254" y="982.811" font-size="24" fill="white" font-weight="bold" text-anchor="start">B01</text><rect x="549.405" y="983.797" width="131.918" height="65.959" fill="#cdd5cb" stroke="none" stroke-width="2"/><rect x="541.405" y="975.797" width="131.918" height="65.959" fill="white" stroke="#729085" stroke-width="5"/><rect x="541.405" y="975.797" width="21" height="65.959" fill="#729085" stroke="none" stroke-width="2"/><rect x="544.405" y="978.797" width="70" height="35" fill="#223740" stroke="none" stroke-width="2"/><text x="549.405" y="1004.8" font-size="24" fill="white" font-weight="bold" text-anchor="start">B02</text><text x="2327" y="630" font-size="30" fill="#223740" font-weight="bold" text-anchor="middle">N</text><path d="M2327,665 l-14,45 l14,-13 l14,13 Z" fill="#223740" stroke="none" stroke-width="2"/><path d="M2483,396 L3133,396" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="456" font-size="31" fill="#223740" font-weight="bold" text-anchor="start">SITE PROGRAM</text><text x="2483" y="540" font-size="27" fill="#223740" font-weight="bold" text-anchor="start">B01 / Locomotive running-repair shop</text><text x="2483" y="583" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">1 levels; 1,440 m² concept gross area.</text><text x="2483" y="662" font-size="27" fill="#223740" font-weight="bold" text-anchor="start">B02 / Dispatch and crew house</text><text x="2483" y="705" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">1 levels; 648 m² concept gross area.</text><text x="2483" y="784" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">STATUS</text><text x="2483" y="827" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">SYNTHETIC OPERATING</text><text x="2483" y="906" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">PRECISION</text><text x="2483" y="949" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">Local concept envelope, not a surveyed</text><text x="2483" y="988" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">parcel or installed equipment record.</text><text x="2483" y="1067" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">DEPENDENCIES</text><text x="2483" y="1110" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">Original industrial source geometry and</text><text x="2483" y="1149" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">engineering constraints control.;</text><text x="2483" y="1188" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">Pedestrian routes segregated from rail</text><text x="2483" y="1227" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">movements, truck reversing and</text><text x="2483" y="1266" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">handling.; No expansion beyond source</text><text x="2483" y="1305" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">operating capacity;</text><text x="2483" y="1344" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">utilities/fire/containment design</text><text x="2483" y="1383" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">unresolved.; Shop track linkage</text><text x="2483" y="1422" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">references YARD-FAC-TAY-YARD-shop;</text><text x="2483" y="1461" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">concept building placement must be</text><text x="2483" y="1500" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">reconciled with that track before design</text><text x="2483" y="1539" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">acceptance. No fresh rail lines are</text><text x="2483" y="1578" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">drawn.; Heavy locomotive overhaul stays</text><text x="2483" y="1617" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">outsourced; running-repair hall does not</text><text x="2483" y="1656" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">imply full rebuild capacity.</text><rect x="158" y="2088" width="139.613" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="297.613" y="2088" width="139.613" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><rect x="437.227" y="2088" width="139.613" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="576.84" y="2088" width="139.613" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><text x="158" y="2132" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">0</text><text x="437.227" y="2132" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">250</text><text x="716.453" y="2132" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">500</text><text x="746.453" y="2104" font-size="21" fill="#687b80" font-weight="normal" text-anchor="start">FEET</text><text x="900" y="2116" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">Planning envelope / Reference north / Geometry and tenure status remain separate</text><text x="2483" y="2050" font-size="18" fill="#687b80" font-weight="normal" text-anchor="start">SH-IND-FAC-TAY-YARD / SH-MAP-ARU-021</text></svg>
