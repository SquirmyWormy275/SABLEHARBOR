-size="20" fill="#687b80" font-weight="normal" text-anchor="middle">600</text><text x="1111.86" y="417" font-size="27" fill="#223740" font-weight="bold" text-anchor="middle">600′ OVERALL</text><path d="M73,577 L73,1719" fill="none" stroke="#687b80" stroke-width="1.5"/><text x="53" y="1148.0" transform="rotate(-90 53 1148.0)" text-anchor="middle" font-size="22" fill="#687b80">350′</text><text x="2375" y="473" font-size="30" fill="#223740" font-weight="bold" text-anchor="middle">N</text><path d="M2375,508 l-14,45 l14,-13 l14,13 Z" fill="#223740" stroke="none" stroke-width="2"/><path d="M2483,396 L3133,396" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="456" font-size="31" fill="#223740" font-weight="bold" text-anchor="start">THIS FLOOR</text><text x="2483" y="550" font-size="62" fill="#223740" font-weight="bold" text-anchor="start">2</text><text x="2483" y="605" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">FITTED WORKPLACES</text><text x="2483" y="710" font-size="62" fill="#223740" font-weight="bold" text-anchor="start">210,000</text><text x="2483" y="765" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">GROSS SQUARE FEET</text><path d="M2483,840 L3133,840" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="898" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">PEOPLE / CAPACITY</text><text x="2483" y="948" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Planned concurrent load: 8. Fitted</text><text x="2483" y="988.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">workplaces, meeting seats, learners and</text><text x="2483" y="1029" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">residents are separate measures; actual</text><text x="2483" y="1069.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">occupancy remains unestablished.</text><text x="2483" y="1158" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">COORDINATED BUILDING</text><text x="2483" y="1208" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">1 levels use the same footprint and</text><text x="2483" y="1248.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">aligned service/core positions. Rooms</text><text x="2483" y="1289" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">are local concept allocations, not an</text><text x="2483" y="1329.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">as-built survey.</text><text x="2483" y="1418" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">ACCESS AND STATUS</text><text x="2483" y="1468" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Opposed perimeter exits with clear</text><text x="2483" y="1508.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">personnel paths separated from</text><text x="2483" y="1549" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">handling/vehicle zones. Detailed exit</text><text x="2483" y="1589.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">distances and protective separation</text><text x="2483" y="1630" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">unverified.</text><text x="137" y="1828" font-size="30" fill="#3f7088" font-weight="bold" text-anchor="start">01</text><text x="209" y="1828" font-size="29" fill="#223740" font-weight="bold" text-anchor="start">OPERATIONAL ZONES</text><text x="209" y="1874" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">Dashed lines allocate work areas, not walls or</text><text x="209" y="1914.5" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">installed equipment. Internal thresholds and</text><text x="209" y="1955" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">engineered handling paths remain unresolved.</text><text x="1317" y="1828" font-size="30" fill="#3f7088" font-weight="bold" text-anchor="start">02</text><text x="1389" y="1828" font-size="29" fill="#223740" font-weight="bold" text-anchor="start">PERIMETER ACCESS</text><text x="1389" y="1874" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">Sourced openings reserve personnel and handling</text><text x="1389" y="1914.5" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">interfaces. The service band remains inside the</text><text x="1389" y="1955" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">gross area; final fire, utility and accessibility</text><text x="1389" y="1995.5" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">design requires engineering.</text><rect x="162" y="2050" width="32.6286" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="194.629" y="2050" width="32.6286" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><rect x="227.257" y="2050" width="32.6286" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="259.886" y="2050" width="32.6286" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><text x="162" y="2094" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">0</text><text x="227.257" y="2094" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">20</text><text x="292.514" y="2094" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">40</text><text x="322.514" y="2066" font-size="21" fill="#687b80" font-weight="normal" text-anchor="start">FEET</text><text x="1010" y="2090" font-size="23" fill="#687b80" font-weight="normal" text-anchor="start">Blue: operational work  /  Sage: secondary program  /  Sand: shared and visitor areas</text></svg>
