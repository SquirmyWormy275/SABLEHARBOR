ed; no occupied</text><text x="2483" y="944" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">building dimensions or count supported.</text><text x="2483" y="983" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">Site/context plus track records suffice.</text><rect x="158" y="2088" width="74.4604" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="232.46" y="2088" width="74.4604" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><rect x="306.921" y="2088" width="74.4604" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="381.381" y="2088" width="74.4604" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><text x="158" y="2132" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">0</text><text x="306.921" y="2132" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">100</text><text x="455.842" y="2132" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">200</text><text x="485.842" y="2104" font-size="21" fill="#687b80" font-weight="normal" text-anchor="start">FEET</text><text x="900" y="2116" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">Planning envelope / Reference north / Geometry and tenure status remain separate</text><text x="2483" y="2050" font-size="18" fill="#687b80" font-weight="normal" text-anchor="start">SH-IND-FAC-WAM-INT / SH-MAP-ARU-020</text></svg>
