<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:DejaVu Sans,sans-serif;fill:#172e40} .muted{fill:#637078}</style><rect x="0" y="0" width="1600" height="1000" fill="#faf9f5" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1600" height="95" fill="#172e40" stroke="none" stroke-width="1"/><text x="45" y="47" font-size="25" font-weight="bold" text-anchor="start" style="fill:white">SABLE HARBOR</text><text x="1555" y="43" font-size="19" font-weight="normal" text-anchor="end" style="fill:white">SH-MAP-ARU-022</text><text x="45" y="135" font-size="32" font-weight="bold" text-anchor="start" style="fill:#172e40">Locomotive running-repair shop · building program</text><text x="45" y="171" font-size="18" font-weight="normal" text-anchor="start" style="fill:#172e40">SH-IND-FAC-TAY-YARD-B01  |  same footprint, cores and access strategy across floors</text><text x="45" y="206" font-size="16" font-weight="normal" text-anchor="start" style="fill:#922d35">ILLUSTRATIVE FITOUT EXISTING FUNCTION NOT AS BUILT</text><path d="M45,888 L1555,888" fill="none" stroke="#172e40" stroke-width="1"/><text x="45" y="919" font-size="16" font-weight="normal" text-anchor="start" style="fill:#172e40">11 SEP 2026  |  Rev 0.1.0  |  Concept design; not an occupied-building or construction record</text><text x="45" y="948" font-size="15" font-weight="normal" text-anchor="start" style="fill:#172e40">Local metric frame; reference north ↑  |  Not surveyed; do not scale the exported page</text><text x="45" y="975" font-size="13" font-weight="normal" text-anchor="start" style="fill:#172e40">Source: geospatial/facilities/source/industrial_facilities.json</text><rect x="60" y="275" width="900" height="110" fill="#172e40" stroke="none" stroke-width="1"/><text x="85" y="310" font-size="22" font-weight="normal" text-anchor="start" style="fill:white">SH-IND-FAC-TAY-YARD-B01-L01 · Locomotive running-repair shop — ground level</text><text x="85" y="350" font-size="17" font-weight="normal" text-anchor="start" style="fill:white">1,440 m² gross · 10 planned peak · ILLUSTRATIVE NOT SURVEYED</text><text x="1040" y="275" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">STRUCTURE</text><text x="1040" y="298" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Concept structural bay scheme; loads, spans, height and</text><text x="1040" y="318" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">fire system subject to engineering. No construction</text><text x="1040" y="338" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">approval.</text><text x="1040" y="378" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">VERTICAL SERVICES</text><text x="1040" y="401" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Single level with direct perimeter exits; wet/service zone</text><text x="1040" y="421" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">reserved in support band. No automatic office core. Floor</text><text x="1040" y="441" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">level/accessibility and rated egress design unverified.</text><text x="1040" y="481" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">PROGRAM</text><text x="1040" y="504" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">1 levels; 1,440 m² gross. Vertical access follows the</text><text x="1040" y="524" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">floor/core plan. Mechanical loads and structure are design</text><text x="1040" y="544" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">dependencies.</text><text x="1040" y="584" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">CONSTRUCTION STATE</text><text x="1040" y="607" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">September 2026: modelled concept only. Acquisition,</text><text x="1040" y="627" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">permits, shell, fit-out and commissioning dates are null</text><text x="1040" y="647" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">until supported. 2031 and 2036 are capacity horizons, not</text><text x="1040" y="667" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">completion promises.</text></svg>
