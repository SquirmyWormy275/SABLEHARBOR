 width="2176" height="300" fill="#e3edf0" stroke="#223740" stroke-width="3"/><text x="178" y="1295" font-size="38" fill="#223740" font-weight="bold" text-anchor="start">L01 / COHORT / FACULTY AND VISITOR RESIDENCE</text><text x="178" y="1350" font-size="29" fill="#687b80" font-weight="normal" text-anchor="start">10,080 gross sq ft  /  0 workplaces  /  20 planned peak</text><text x="178" y="1415" font-size="26" fill="#223740" font-weight="normal" text-anchor="start">Room101 / cohort · Room102 / cohort · Room103 / cohort · Room104 / cohort · Room105 / cohort · Room106 / cohort · Room107 / cohort · Room108 / cohort ·</text><text x="178" y="1454" font-size="26" fill="#223740" font-weight="normal" text-anchor="start">Room109 / cohort · Room110 / cohort · Room111 / cohort · Room112 / cohort · Room113 / cohort · Room114 / cohort · Room115 / cohort · Room116 / cohort ·</text><text x="178" y="1493" font-size="26" fill="#223740" font-weight="normal" text-anchor="start">Room117 / faculty / visitor · Room118 / faculty / visitor · Room119 / faculty / visitor · Room120 / faculty / visitor</text><path d="M2483,430 L3133,430" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="465" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">PROGRAM</text><text x="2483" y="513" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">3 floors / 30,240 gross sq ft. Staff</text><text x="2483" y="553.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">workplaces, training, meeting, dining</text><text x="2483" y="594" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">and residence remain separate</text><text x="2483" y="634.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">capacities.</text><path d="M2483,715 L3133,715" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="750" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">STRUCTURE / SERVICES</text><text x="2483" y="798" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Coordinated concept structural planning</text><text x="2483" y="838.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">grid; exact member sizes and loads</text><text x="2483" y="879" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">unengineered. Fixed stairs, lifts,</text><text x="2483" y="919.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">risers and wet cores preserved on every</text><text x="2483" y="960" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">level.</text><path d="M2483,1040.5 L3133,1040.5" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="1075.5" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">CORE COORDINATION</text><text x="2483" y="1123.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Explicit R01-based north-up core</text><text x="2483" y="1164" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">geometry; no automatic end-core</text><text x="2483" y="1204.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">overlay. All floor areas partition into</text><text x="2483" y="1245" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">rooms, fixed cores and circulation.</text><path d="M2483,1325.5 L3133,1325.5" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="1360.5" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">SEPTEMBER 2026</text><text x="2483" y="1408.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Concept design only. Parcel, tenure,</text><text x="2483" y="1449" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">permit, construction and occupancy</text><text x="2483" y="1489.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">evidence remain separate. No completed</text><text x="2483" y="1530" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">facility is asserted.</text><text x="137" y="1840" font-size="30" fill="#3f7088" font-weight="bold" text-anchor="start">01</text><text x="209" y="1840" font-size="29" fill="#223740" font-weight="bold" text-anchor="start">ONE BUILDING</text><text x="209" y="1886" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">Floorplates and service shafts align vertically. Detailed</text><text x="209" y="1926.5" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">engineering and fire strategy remain coordinated design</text><text x="209" y="1967" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">dependencies.</text><text x="162" y="2080" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">SH-SITE-0001-D / LOCAL CONCEPT STACK / NOT TO SCALE</text></svg>
