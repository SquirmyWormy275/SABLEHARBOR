" font-weight="normal" text-anchor="start" style="fill:#172e40">unestablished.</text><text x="950" y="528" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">DEPENDENCIES</text><text x="950" y="551" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Local geometry does not relocate industrial anchors or create</text><text x="950" y="571" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">installed process equipment, transport rights or host</text><text x="950" y="591" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">ownership.</text><text x="950" y="629" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">CAPACITY</text><text x="950" y="652" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">People and seats are separate measures. See population bridge</text><text x="950" y="672" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">and source assumptions.</text><text x="900" y="821" font-size="14" font-weight="bold" text-anchor="start" style="fill:#172e40">ACCESS LEGEND</text><path d="M900,843 L928,843" fill="none" stroke="#9eaaa7" stroke-width="4"/><text x="936" y="847" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Service / emergency</text><path d="M1200,843 L1228,843" fill="none" stroke="#ae9d7b" stroke-width="4"/><text x="1236" y="847" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Public arrival</text><path d="M900,867 L928,867" fill="none" stroke="#24716d" stroke-width="4"/><text x="936" y="871" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Pedestrian</text><path d="M1200,867 L1228,867" fill="none" stroke="#922d35" stroke-width="4"/><text x="1236" y="871" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Controlled entry</text></svg>
