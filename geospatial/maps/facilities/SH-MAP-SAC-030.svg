<svg xmlns="http://www.w3.org/2000/svg" width="3240" height="2304" viewBox="0 0 3240 2304"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="3240" height="2304" fill="#f7f6f1" stroke="none" stroke-width="2"/><text x="108" y="107" font-size="42" fill="#223740" font-weight="bold" text-anchor="start" letter-spacing="11">SABLE HARBOR</text><text x="3133" y="102" font-size="28" fill="#223740" font-weight="normal" text-anchor="end">SACRAMENTO / INSTITUTIONAL CAMPUS</text><path d="M107,149 L3135,149" fill="none" stroke="#223740" stroke-width="3"/><text x="108" y="249" font-size="62.5" fill="#223740" font-weight="bold" text-anchor="start">EDUCATION / BUILDING PROGRAM</text><text x="108" y="313" font-size="31" fill="#687b80" font-weight="normal" text-anchor="start">Coordinated floor stack  •  Same footprint and fixed service cores</text><rect x="2645" y="203" width="489" height="64" fill="#223740" stroke="none" stroke-width="2"/><text x="2890" y="241" font-size="26" fill="white" font-weight="bold" text-anchor="middle">CONCEPT REVIEW / R02</text><path d="M107,2147 L3135,2147" fill="none" stroke="#223740" stroke-width="3"/><text x="108" y="2205" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">COORDINATED DESIGN STUDY  •  11 SEPTEMBER 2026</text><text x="108" y="2248" font-size="23" fill="#687b80" font-weight="normal" text-anchor="start">Concept geometry; parcel, engineering and code review remain open. Areas and seats are design proposals.</text><text x="3133" y="2216" font-size="44" fill="#223740" font-weight="bold" text-anchor="end">SH-MAP-SAC-030</text><text x="3133" y="2267" font-size="22" fill="#687b80" font-weight="normal" text-anchor="end">BUILDING PROGRAM / R02</text><rect x="133" y="530" width="2176" height="300" fill="#e3edf0" stroke="#223740" stroke-width="3"/><text x="178" y="595" font-size="38" fill="#223740" font-weight="bold" text-anchor="start">L02 / FACULTY / CASE DESIGN / EXECUTIVE SIMULATIONS</text><text x="178" y="650" font-size="29" fill="#687b80" font-weight="normal" text-anchor="start">15,120 gross sq ft  /  28 workplaces  /  28 planned peak</text><text x="178" y="715" font-size="26" fill="#223740" font-weight="normal" text-anchor="start">Faculty / Brett Calder · Case design and learning development · Executive / Board simulation · Facilitated breakout · Learning operations · Visiting practitioner</text><text x="178" y="754" font-size="26" fill="#223740" font-weight="normal" text-anchor="start">work</text><rect x="133" y="880" width="2176" height="300" fill="#e3edf0" stroke="#223740" stroke-width="3"/><text x="178" y="945" font-size="38" fill="#223740" font-weight="bold" text-anchor="start">L01 / TEACHING / CONVENING / SHARED HOSPITALITY</text><text x="178" y="1000" font-size="29" fill="#687b80" font-weight="normal" text-anchor="start">15,120 gross sq ft  /  4 workplaces  /  128 planned peak</text><text x="178" y="1065" font-size="26" fill="#223740" font-weight="normal" text-anchor="start">Convening hall · Classroom01 · Classroom02 · Education reception · Campus dining</text><path d="M2483,430 L3133,430" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="465" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">PROGRAM</text><text x="2483" y="513" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">2 floors / 30,240 gross sq ft. Staff</text><text x="2483" y="553.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">workplaces, training, meeting, dining</text><text x="2483" y="594" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">and residence remain separate</text><text x="2483" y="634.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">capacities.</text><path d="M2483,715 L3133,715" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="750" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">STRUCTURE / SERVICES</text><text x="2483" y="798" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Coordinated concept structural planning</text><text x="2483" y="838.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">grid; exact member sizes and loads</text><text x="2483" y="879" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">unengineered. Fixed stairs, lifts,</text><text x="2483" y="919.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">risers and wet cores preserved on every</text><text x="2483" y="960" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">level.</text><path d="M2483,1040.5 L3133,1040.5" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="1075.5" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">CORE COORDINATION</text><text x="2483" y="1123.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Explicit R01-based north-up core</text><text x="2483" y="1164" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">geometry; no automatic end-core</text><text x="2483" y="1204.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">overlay. All floor areas partition into</text><text x="2483" y="1245" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">rooms, fixed cores and circulation.</text><path d="M2483,1325.5 L3133,1325.5" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="1360.5" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">SEPTEMBER 2026</text><text x="2483" y="1408.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Concept design only. Parcel, tenure,</text><text x="2483" y="1449" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">permit, construction and occupancy</text><text x="2483" y="1489.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">evidence remain separate. No completed</text><text x="2483" y="1530" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">facility is asserted.</text><text x="137" y="1840" font-size="30" fill="#3f7088" font-weight="bold" text-anchor="start">01</text><text x="209" y="1840" font-size="29" fill="#223740" font-weight="bold" text-anchor="start">ONE BUILDING</text><text x="209" y="1886" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">Floorplates and service shafts align vertically. Detailed</text><text x="209" y="1926.5" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">engineering and fire strategy remain coordinated design</text><text x="209" y="1967" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">dependencies.</text><text x="162" y="2080" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">SH-SITE-0001-C / LOCAL CONCEPT STACK / NOT TO SCALE</text></svg>
