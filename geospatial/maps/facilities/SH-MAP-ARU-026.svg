<svg xmlns="http://www.w3.org/2000/svg" width="3240" height="2304" viewBox="0 0 3240 2304"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="3240" height="2304" fill="#f7f6f1" stroke="none" stroke-width="2"/><text x="108" y="107" font-size="42" fill="#223740" font-weight="bold" text-anchor="start" letter-spacing="11">SABLE HARBOR</text><text x="3133" y="102" font-size="28" fill="#223740" font-weight="normal" text-anchor="end">TAYLOR INDUSTRIAL TRANSLOAD COMPLEX / FACILITY STUDY</text><path d="M107,149 L3135,149" fill="none" stroke="#223740" stroke-width="3"/><text x="108" y="249" font-size="62.5" fill="#223740" font-weight="bold" text-anchor="start">TAYLOR INDUSTRIAL TRANSLOAD COMPLEX</text><text x="108" y="313" font-size="31" fill="#687b80" font-weight="normal" text-anchor="start">Operating context and local planning envelope  •  Reference north is up</text><rect x="2645" y="203" width="489" height="64" fill="#223740" stroke="none" stroke-width="2"/><text x="2890" y="241" font-size="26" fill="white" font-weight="bold" text-anchor="middle">CONCEPT REVIEW / R02</text><path d="M107,2147 L3135,2147" fill="none" stroke="#223740" stroke-width="3"/><text x="108" y="2205" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">COORDINATED DESIGN STUDY  •  11 SEPTEMBER 2026</text><text x="108" y="2248" font-size="23" fill="#687b80" font-weight="normal" text-anchor="start">Concept geometry; parcel, engineering and code review remain open. Areas and seats are design proposals.</text><text x="3133" y="2216" font-size="44" fill="#223740" font-weight="bold" text-anchor="end">SH-MAP-ARU-026</text><text x="3133" y="2267" font-size="22" fill="#687b80" font-weight="normal" text-anchor="end">MASTER PLAN / R02</text><rect x="120" y="427" width="1632" height="1632" fill="#ebeee6" stroke="#223740" stroke-width="3"/><rect x="195.651" y="540.476" width="1480.7" height="1405.05" fill="#e7e9e5" stroke="#a7b5ae" stroke-width="1.5"/><text x="936" y="1243" font-size="25" fill="#687b80" font-weight="bold" text-anchor="middle">GENERAL TRANSFER / SEGREGATED LIQUID HANDLING</text><path d="M150.26,2028.74 L1721.74,2028.74" fill="none" stroke="#bdc5c0" stroke-width="14"/><path d="M1721.74,2028.74 L1721.74,457.26" fill="none" stroke="#bdc5c0" stroke-width="14"/><path d="M1721.74,457.26 L150.26,457.26" fill="none" stroke="#bdc5c0" stroke-width="14"/><path d="M150.26,457.26 L150.26,2028.74" fill="none" stroke="#bdc5c0" stroke-width="14"/><path d="M528,2059 L528,2002.26" fill="none" stroke="#bdc5c0" stroke-width="14"/><path d="M1425.6,2059 L1425.6,1964.44" fill="none" stroke="#bdc5c0" stroke-width="14"/><text x="2327" y="630" font-size="30" fill="#223740" font-weight="bold" text-anchor="middle">N</text><path d="M2327,665 l-14,45 l14,-13 l14,13 Z" fill="#223740" stroke="none" stroke-width="2"/><path d="M2483,396 L3133,396" fill="none" stroke="#a5b4b2" stroke-width="2"/><text x="2483" y="456" font-size="31" fill="#223740" font-weight="bold" text-anchor="start">SITE PROGRAM</text><text x="2483" y="540" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">STATUS</text><text x="2483" y="583" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">SYNTHETIC OPERATING</text><text x="2483" y="662" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">PRECISION</text><text x="2483" y="705" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">Local concept envelope, not a surveyed</text><text x="2483" y="744" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">parcel or installed equipment record.</text><text x="2483" y="823" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">DEPENDENCIES</text><text x="2483" y="866" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">General and segregated liquid transload</text><text x="2483" y="905" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">functions established, but no occupied</text><text x="2483" y="944" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">building envelope supplied. Site</text><text x="2483" y="983" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">handling zones are conceptual; no tank,</text><text x="2483" y="1022" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">pipe, containment sizing or installation</text><text x="2483" y="1061" font-size="26" fill="#687b80" font-weight="normal" text-anchor="start">inferred.</text><rect x="158" y="2088" width="57.6458" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="215.646" y="2088" width="57.6458" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><rect x="273.292" y="2088" width="57.6458" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="330.937" y="2088" width="57.6458" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><text x="158" y="2132" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">0</text><text x="273.292" y="2132" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">100</text><text x="388.583" y="2132" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">200</text><text x="418.583" y="2104" font-size="21" fill="#687b80" font-weight="normal" text-anchor="start">FEET</text><text x="900" y="2116" font-size="24" fill="#687b80" font-weight="normal" text-anchor="start">Planning envelope / Reference north / Geometry and tenure status remain separate</text><text x="2483" y="2050" font-size="18" fill="#687b80" font-weight="normal" text-anchor="start">SH-IND-FAC-TAY-TERMINAL / SH-MAP-ARU-026</text></svg>
