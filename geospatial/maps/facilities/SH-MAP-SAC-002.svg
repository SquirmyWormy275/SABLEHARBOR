tyle="fill:#172e40">ONE CAMPUS</text><text x="950" y="288" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">11.86 acres / 48,000 m² illustrative envelope. District is</text><text x="950" y="308" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">accepted; property polygon and tenure are unestablished.</text><text x="950" y="346" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">PUBLIC TO RESTRICTED</text><text x="950" y="369" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Arrival to Governance and Education. J2 entry on its own</text><text x="950" y="389" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">controlled edge. Audit has a separately controlled suite; no</text><text x="950" y="409" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">ESS pre-clearance.</text><text x="950" y="447" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">SERVICE AND RESILIENCE</text><text x="950" y="470" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Perimeter emergency/service loop; north receiving route.</text><text x="950" y="490" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Local edge, dual communications entries and staged utilities</text><text x="950" y="510" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">only; no primary data center.</text><text x="950" y="548" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">CAPACITY AND EXPANSION</text><text x="950" y="571" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">200 parking / 64 bicycle spaces. Third ESS level is a future</text><text x="950" y="591" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">shell; west reserve supports a separately gated ten-year</text><text x="950" y="611" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">option.</text><text x="950" y="649" font-size="16" font-weight="bold" text-anchor="start" style="fill:#172e40">LANDSCAPE AND MATERIALS</text><text x="950" y="672" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Shaded pedestrian court, stormwater landscape, durable</text><text x="950" y="692" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">concrete/metal/stone, warm timber interiors and a restrained</text><text x="950" y="712" font-size="14" font-weight="normal" text-anchor="start" style="fill:#172e40">Sable Harbor arrival monument.</text><text x="900" y="821" font-size="14" font-weight="bold" text-anchor="start" style="fill:#172e40">ACCESS LEGEND</text><path d="M900,843 L928,843" fill="none" stroke="#9eaaa7" stroke-width="4"/><text x="936" y="847" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Service / emergency</text><path d="M1200,843 L1228,843" fill="none" stroke="#ae9d7b" stroke-width="4"/><text x="1236" y="847" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Public arrival</text><path d="M900,867 L928,867" fill="none" stroke="#24716d" stroke-width="4"/><text x="936" y="871" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Pedestrian</text><path d="M1200,867 L1228,867" fill="none" stroke="#922d35" stroke-width="4"/><text x="1236" y="871" font-size="12" font-weight="normal" text-anchor="start" style="fill:#172e40">Controlled entry</text></svg>
