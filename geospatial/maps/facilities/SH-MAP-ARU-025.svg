text><text x="209" y="1955" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">engineered handling paths remain unresolved.</text><text x="1317" y="1828" font-size="30" fill="#3f7088" font-weight="bold" text-anchor="start">02</text><text x="1389" y="1828" font-size="29" fill="#223740" font-weight="bold" text-anchor="start">PERIMETER ACCESS</text><text x="1389" y="1874" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">Sourced openings reserve personnel and handling</text><text x="1389" y="1914.5" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">interfaces. The service band remains inside the</text><text x="1389" y="1955" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">gross area; final fire, utility and accessibility</text><text x="1389" y="1995.5" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">design requires engineering.</text><rect x="162" y="2050" width="128.964" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="290.964" y="2050" width="128.964" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><rect x="419.929" y="2050" width="128.964" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="548.893" y="2050" width="128.964" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><text x="162" y="2094" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">0</text><text x="419.929" y="2094" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">14</text><text x="677.857" y="2094" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">28</text><text x="707.857" y="2066" font-size="21" fill="#687b80" font-weight="normal" text-anchor="start">FEET</text><text x="1010" y="2090" font-size="23" fill="#687b80" font-weight="normal" text-anchor="start">Blue: operational work  /  Sage: secondary program  /  Sand: shared and visitor areas</text></svg>
