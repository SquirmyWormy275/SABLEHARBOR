bold" text-anchor="start">COORDINATED BUILDING</text><text x="2483" y="1208" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">1 levels use the same footprint and</text><text x="2483" y="1248.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">aligned service/core positions. Rooms</text><text x="2483" y="1289" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">are local concept allocations, not an</text><text x="2483" y="1329.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">as-built survey.</text><text x="2483" y="1418" font-size="28" fill="#223740" font-weight="bold" text-anchor="start">ACCESS AND STATUS</text><text x="2483" y="1468" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">Access follows the sourced circulation</text><text x="2483" y="1508.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">and room classification. Geometry,</text><text x="2483" y="1549" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">services and final code review remain</text><text x="2483" y="1589.5" font-size="27" fill="#223740" font-weight="normal" text-anchor="start">design dependencies.</text><text x="137" y="1828" font-size="30" fill="#3f7088" font-weight="bold" text-anchor="start">01</text><text x="209" y="1828" font-size="29" fill="#223740" font-weight="bold" text-anchor="start">COORDINATED ACCESS</text><text x="209" y="1874" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">Room entries connect to shared or controlled</text><text x="209" y="1914.5" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">circulation; vertical cores are coordinated</text><text x="209" y="1955" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">across the building.</text><text x="1317" y="1828" font-size="30" fill="#3f7088" font-weight="bold" text-anchor="start">02</text><text x="1389" y="1828" font-size="29" fill="#223740" font-weight="bold" text-anchor="start">PLANNING BOUNDARY</text><text x="1389" y="1874" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">Local concept geometry preserves current</text><text x="1389" y="1914.5" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">functions. Occupancy, construction, engineering</text><text x="1389" y="1955" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">and exact parcel evidence remain separately</text><text x="1389" y="1995.5" font-size="27" fill="#687b80" font-weight="normal" text-anchor="start">governed.</text><rect x="162" y="2050" width="101.524" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="263.524" y="2050" width="101.524" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><rect x="365.048" y="2050" width="101.524" height="14" fill="#223740" stroke="#223740" stroke-width="1.5"/><rect x="466.571" y="2050" width="101.524" height="14" fill="#f7f6f1" stroke="#223740" stroke-width="1.5"/><text x="162" y="2094" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">0</text><text x="365.048" y="2094" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">14</text><text x="568.095" y="2094" font-size="21" fill="#223740" font-weight="normal" text-anchor="middle">28</text><text x="598.095" y="2066" font-size="21" fill="#687b80" font-weight="normal" text-anchor="start">FEET</text><text x="1010" y="2090" font-size="23" fill="#687b80" font-weight="normal" text-anchor="start">Blue: operational work  /  Sage: secondary program  /  Sand: shared and visitor areas</text></svg>
