[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blackridge-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2,<3", "alembic>=1.13,<2", "pydantic>=2,<3", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
blackridge = "blackridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

