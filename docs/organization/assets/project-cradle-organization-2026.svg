<text x="48" y="52" class="title">PROJECT CRADLE — ORGANIZATION</text>
<text x="48" y="78" class="subtitle">Founding team, recovery-system boundary and host-operator separation</text>
<g class="card"><rect x="505" y="105" width="390" height="122" rx="3" fill="#FFFFFF" stroke="#557384" stroke-width="1.5"/><rect x="505" y="105" width="390" height="6" fill="#4E7762"/><rect x="505" y="111" width="390" height="34" fill="#17384A"/><text x="517" y="134" class="name" text-anchor="start"><tspan x="517" dy="0">KENJI ARAKAWA</tspan></text><text x="517" y="164" class="role" text-anchor="start"><tspan x="517" dy="0">Project Cradle lead</tspan></text><text x="517" y="184" class="note" text-anchor="start"><tspan x="517" dy="0">Extractive metallurgy + program ownership</tspan></text><rect x="505" y="203" width="390" height="24" fill="#E7E9E7"/><text x="517" y="219" class="status" text-anchor="start"><tspan x="517" dy="0">LOCKED ROLE</tspan></text></g><text x="50" y="285" class="band" text-anchor="start"><tspan x="50" dy="0">FOUNDING TEAM</tspan></text><g class="card"><rect x="150" y="310" width="270" height="132" rx="3" fill="#FFFFFF" stroke="#557384" stroke-width="1.5"/><rect x="150" y="310" width="270" height="6" fill="#4E7762"/><rect x="150" y="316" width="270" height="34" fill="#17384A"/><text x="162" y="339" class="name" text-anchor="start"><tspan x="162" dy="0">TESSA QUINN</tspan></text><text x="162" y="369" class="role" text-anchor="start"><tspan x="162" dy="0">Economic geology</tspan></text><text x="162" y="389" class="note" text-anchor="start"><tspan x="162" dy="0">Chemistry cannot negotiate with geology</tspan></text><rect x="150" y="418" width="270" height="24" fill="#E7E9E7"/><text x="162" y="434" class="status" text-anchor="start"><tspan x="162" dy="0">LOCKED FOUNDING TEAM</tspan></text></g><path d="M 700 227 L 700 268 L 285 268 L 285 310" class="solid"/><g class="card"><rect x="565" y="310" width="270" height="132" rx="3" fill="#FFFFFF" stroke="#557384" stroke-width="1.5"/><rect x="565" y="310" width="270" height="6" fill="#4E7762"/><rect x="565" y="316" width="270" height="34" fill="#17384A"/><text x="577" y="339" class="name" text-anchor="start"><tspan x="577" dy="0">LUIS ORTEGA</tspan></text><text x="577" y="369" class="role" text-anchor="start"><tspan x="577" dy="0">Process engineering + operating reality</tspan></text><text x="577" y="389" class="note" text-anchor="start"><tspan x="577" dy="0">Where does it go?</tspan></text><rect x="565" y="418" width="270" height="24" fill="#E7E9E7"/><text x="577" y="434" class="status" text-anchor="start"><tspan x="577" dy="0">LOCKED FOUNDING TEAM</tspan></text></g><path d="M 700 227 L 700 268 L 700 268 L 700 310" class="solid"/><g class="card"><rect x="980" y="310" width="270" height="132" rx="3" fill="#FFFFFF" stroke="#557384" stroke-width="1.5"/><rect x="980" y="310" width="270" height="6" fill="#4E7762"/><rect x="980" y="316" width="270" height="34" fill="#17384A"/><text x="992" y="339" class="name" text-anchor="start"><tspan x="992" dy="0">MAEVE DONNELLY</tspan></text><text x="992" y="369" class="role" text-anchor="start"><tspan x="992" dy="0">Data engineering + material genealogy</tspan></text><text x="992" y="389" class="note" text-anchor="start"><tspan x="992" dy="0">Source → process → stream → destination</tspan></text><rect x="980" y="418" width="270" height="24" fill="#E7E9E7"/><text x="992" y="434" class="status" text-anchor="start"><tspan x="992" dy="0">LOCKED FOUNDING TEAM</tspan></text></g><path d="M 700 227 L 700 268 L 1115 268 L 1115 310" class="solid"/><g class="card"><rect x="505" y="535" width="390" height="140" rx="3" fill="#FFFFFF" stroke="#557384" stroke-width="1.5"/><rect x="505" y="535" width="390" height="6" fill="#4E7762"/><rect x="505" y="541" width="390" height="34" fill="#17384A"/><text x="517" y="564" class="name" text-anchor="start"><tspan x="517" dy="0">PROJECT CRADLE</tspan></text><text x="517" y="594" class="role" text-anchor="start"><tspan x="517" dy="0">Rare-earth recovery from existing process streams</tspan></text><text x="517" y="614" class="note" text-anchor="start"><tspan x="517" dy="0">Owns/controls recovery intervention; generally not host mine</tspan></text><rect x="505" y="651" width="390" height="24" fill="#E7E9E7"/><text x="517" y="667" class="status" text-anchor="start"><tspan x="517" dy="0">LOCKED CANON</tspan></text></g><path d="M 285 442 L 285 488 L 700 488 L 700 535" class="dash"/><path d="M 700 442 L 700 488 L 700 488 L 700 535" class="dash"/><path d="M 1115 442 L 1115 488 L 700 488 L 700 535" class="dash"/><text x="50" y="745" class="band" text-anchor="start"><tspan x="50" dy="0">COMMERCIAL AND OPERATING BOUNDARY</tspan></text><g class="card"><rect x="170" y="770" width="330" height="118" rx="3" fill="#F2ECE4" stroke="#557384" stroke-width="1.5" stroke-dasharray="8 6"/><rect x="170" y="770" width="330" height="6" fill="#557384"/><rect x="170" y="776" width="330" height="34" fill="#17384A"/><text x="182" y="799" class="name" text-anchor="start"><tspan x="182" dy="0">HOST OPERATOR</tspan></text><text x="182" y="829" class="role" text-anchor="start"><tspan x="182" dy="0">Owns and runs host mine / plant</tspan></text><text x="182" y="849" class="note" text-anchor="start"><tspan x="182" dy="0">Customer identity and exact agreement OPEN</tspan></text><rect x="170" y="864" width="330" height="24" fill="#E7E9E7"/><text x="182" y="880" class="status" text-anchor="start"><tspan x="182" dy="0">SEPARATE OPERATOR</tspan></text></g><g class="card"><rect x="535" y="770" width="330" height="118" rx="3" fill="#FFFFFF" stroke="#557384" stroke-width="1.5"/><rect x="535" y="770" width="330" height="6" fill="#4E7762"/><rect x="535" y="776" width="330" height="34" fill="#17384A"/><text x="547" y="799" class="name" text-anchor="start"><tspan x="547" dy="0">RECOVERY INTERVENTION</tspan></text><text x="547" y="829" class="role" text-anchor="start"><tspan x="547" dy="0">Bolt-on process or stream right</tspan></text><text x="547" y="849" class="note" text-anchor="start"><tspan x="547" dy="0">Failure must not interrupt host process</tspan></text><rect x="535" y="864" width="330" height="24" fill="#E7E9E7"/><text x="547" y="880" class="status" text-anchor="start"><tspan x="547" dy="0">LOCKED DOCTRINE</tspan></text></g><g class="card"><rect x="900" y="770" width="330" height="118" rx="3" fill="#F2ECE4" stroke="#557384" stroke-width="1.5" stroke-dasharray="8 6"/><rect x="900" y="770" width="330" height="6" fill="#C5973E"/><rect x="900" y="776" width="330" height="34" fill="#17384A"/><text x="912" y="799" class="name" text-anchor="start"><tspan x="912" dy="0">COMMERCIAL STRUCTURE</tspan></text><text x="912" y="829" class="role" text-anchor="start"><tspan x="912" dy="0">Equipment, access, recovery rights or royalty</tspan></text><text x="912" y="849" class="note" text-anchor="start"><tspan x="912" dy="0">Exact structure OPEN</tspan></text><rect x="900" y="864" width="330" height="24" fill="#E7E9E7"/><text x="912" y="880" class="status" text-anchor="start"><tspan x="912" dy="0">OPEN</tspan></text></g><line x1="500" y1="829" x2="535" y2="829" class="dash"/><line x1="865" y1="829" x2="900" y2="829" class="dash"/>
<text x="48" y="926" class="footer">CANONICAL DATE: 2026-08-31  •  SOLID = LOCKED OPERATING RELATIONSHIP  •  DASHED = SEAM / OPEN STRUCTURE  •  NOT AN HR REPORTING TREE</text>
